<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHALLENGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">

<style>
  /* ==========================================================
     Tokens — DARK is the default (trading-desk + gaming).
     Light is opt-in via [data-theme="light"].
  ========================================================== */
  :root{
    color-scheme:dark;
    --ground:#0a0e16;
    --surface:#111823;
    --surface-2:#1a2332;
    --ink:#e9f0f8;
    --ink-soft:#9aabbe;
    --ink-faint:#5f6f83;
    --line:#222d3d;
    --line-strong:#2f3c4f;
    --accent:#38bdf8;
    --accent-deep:#0e7fb0;
    --accent-ink:#04131d;
    --accent-glow:rgba(56,189,248,.28);
    --violet:#a78bfa;
    --gold:#f2c14e;
    --gold-deep:#e2ab3c;
    --gold-bg:#241d0e;
    --hot:#ff5d73;
    --win:#33d69b;
    --win-deep:#12a074;
    --loss:#ff6b6b;
    --void:#5f6f83;
    --c-reallife:#ff9557;
    --c-live:#ff5d73;
    --c-ent:#c77dff;
    --c-news:#5b9dff;
    --c-sport:#33d69b;
    --c-alltag:#f2c14e;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 26px -16px rgba(0,0,0,.8);
    --maxw:468px;
  }
  :root[data-theme="dark"]{ color-scheme:dark; }
  :root[data-theme="light"]{
    color-scheme:light;
    --ground:#eef2f7;
    --surface:#ffffff;
    --surface-2:#e7edf4;
    --ink:#0c1826;
    --ink-soft:#48596b;
    --ink-faint:#7e8fa1;
    --line:#dce3ec;
    --line-strong:#c8d3df;
    --accent:#0e88b3;
    --accent-deep:#0b6a8d;
    --accent-ink:#ffffff;
    --accent-glow:rgba(14,136,179,.22);
    --violet:#7c3aed;
    --gold:#b9860c;
    --gold-deep:#8a6208;
    --gold-bg:#f7edd3;
    --hot:#e63b52;
    --win:#0f9d68;
    --win-deep:#0b7a50;
    --loss:#dd3a51;
    --void:#7e8fa1;
    --c-reallife:#e8641f;
    --c-live:#e63b52;
    --c-ent:#a83ae0;
    --c-news:#2f6ff0;
    --c-sport:#0f9d68;
    --c-alltag:#c78a0a;
    --shadow:0 1px 2px rgba(16,32,48,.05), 0 12px 28px -18px rgba(16,32,48,.22);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ground);color:var(--ink);
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Space Grotesk','Hanken Grotesk',sans-serif;line-height:1.12;letter-spacing:-.01em;text-wrap:balance;font-weight:600}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,select,textarea{font:inherit;color:inherit}
  .mono{font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  ::selection{background:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--ink)}
  *{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

  /* ---------- Shell ---------- */
  #app{max-width:var(--maxw);margin-inline:auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--ground)}
  @media (min-width:521px){#app{border-inline:1px solid var(--line)}}

  .topbar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:13px 16px 11px;
    background:color-mix(in srgb, var(--ground) 86%, transparent);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:.01em}
  .wordmark .k{color:var(--accent)}
  .proto-chip{font-size:9.5px;font-weight:700;letter-spacing:.16em;padding:3px 6px;border-radius:6px;border:1px solid var(--line);color:var(--ink-faint)}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .cp-pill{display:inline-flex;align-items:center;gap:6px;background:var(--gold-bg);color:var(--gold);padding:5px 11px;border-radius:999px;border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);font-weight:700;font-size:14px;transition:transform .2s ease}
  .cp-pill.pop{transform:scale(1.14)}
  .icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-soft)}
  .icon-btn svg{width:17px;height:17px}

  #view{flex:1;overflow-y:auto;padding:16px 16px 100px}

  .bottomnav{
    position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 6px;
    background:color-mix(in srgb, var(--ground) 92%, transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  }
  .bottomnav button{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-radius:12px;
    color:var(--ink-faint);font-size:10px;font-weight:700;font-family:'Space Grotesk',sans-serif;
    transition:background .15s ease,color .15s ease,transform .1s ease;
  }
  .bottomnav button svg{width:21px;height:21px}
  .bottomnav button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
  .bottomnav button:active{transform:translateY(1px)}

  /* ---------- Buttons: crisp, slight depth (desk + game) ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:14px 18px;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15.5px;
    letter-spacing:.005em;
    background:var(--accent);color:var(--accent-ink);
    box-shadow:0 2px 0 var(--accent-deep), 0 10px 24px -12px var(--accent-glow);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--accent-deep)}
  .btn:disabled{filter:grayscale(.5) opacity(.45);cursor:not-allowed;box-shadow:0 2px 0 var(--line)}
  .btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:0 2px 0 var(--line-strong);border:1px solid var(--line)}
  .btn.gold{background:var(--gold);color:#241a04;box-shadow:0 2px 0 var(--gold-deep),0 10px 24px -12px rgba(242,193,78,.25)}
  .btn.win{background:var(--win);color:#04231a;box-shadow:0 2px 0 var(--win-deep),0 10px 24px -12px rgba(51,214,155,.25)}
  .btn.sm{width:auto;padding:9px 14px;font-size:13.5px;border-radius:10px;box-shadow:0 2px 0 var(--line-strong);background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
  .btn.subtle{width:auto;padding:10px 16px;font-size:13.5px;background:transparent;color:var(--ink-soft);box-shadow:none;border:1px solid var(--line-strong)}
  .btn.subtle:active{transform:translateY(1px);box-shadow:none}

  /* ---------- Player card ---------- */
  .player-card{
    display:flex;align-items:center;gap:13px;padding:14px;border-radius:var(--radius);
    background:linear-gradient(135deg, color-mix(in srgb,var(--accent) 10%,var(--surface)), var(--surface) 70%);
    border:1px solid var(--line-strong);box-shadow:var(--shadow);margin-bottom:16px;
  }
  .pc-av{width:52px;height:52px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:28px;flex-shrink:0}
  .pc-mid{flex:1;min-width:0}
  .pc-top{display:flex;align-items:center;gap:8px}
  .pc-top b{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:11px;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;flex-shrink:0}
  .xpbar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:6px 0 3px}
  .xpbar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .pc-sub{font-size:11px;color:var(--ink-faint)}
  .pc-right{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
  .pc-right span{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
  .pc-cp{color:var(--gold-deep)}
  .pc-streak{color:var(--hot)}

  /* ---------- Sections ---------- */
  .section-head{display:flex;align-items:center;gap:8px;margin:22px 4px 11px}
  .section-head:first-of-type{margin-top:4px}
  .section-head h2{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;letter-spacing:.01em}
  .section-head .count{margin-left:auto;font-size:12px;color:var(--ink-faint);font-weight:600}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* ---------- Challenge card ---------- */
  .ch-card{padding:15px;display:flex;flex-direction:column;gap:11px;transition:border-color .15s ease}
  .ch-card + .ch-card{margin-top:11px}
  .ch-card.is-live{border-color:color-mix(in srgb,var(--c-live) 45%,var(--line));box-shadow:var(--shadow),inset 0 0 0 1px color-mix(in srgb,var(--c-live) 22%,transparent)}
  .ch-head{display:flex;align-items:flex-start;gap:11px}
  .cat-badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex-shrink:0;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
  .ch-q{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:500;letter-spacing:.005em;flex:1;min-width:0;overflow-wrap:anywhere}
  .ch-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-soft)}
  .tag.cat{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
  .tag.live{color:var(--c-live);background:color-mix(in srgb,var(--c-live) 15%,transparent)}
  .tag.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c-live);animation:live-pulse 1.5s ease-in-out infinite}
  @keyframes live-pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 color-mix(in srgb,var(--c-live) 55%,transparent)}50%{opacity:.55;box-shadow:0 0 0 4px transparent}}
  .tag.win{color:var(--win);background:color-mix(in srgb,var(--win) 16%,transparent)}
  .tag.loss{color:var(--loss);background:color-mix(in srgb,var(--loss) 15%,transparent)}
  .tag.void{color:var(--void);background:var(--surface-2)}
  .tag.dispute{color:var(--hot);background:color-mix(in srgb,var(--hot) 14%,transparent)}
  .ch-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ch-pool .n{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px}
  .ch-pool .l{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em}
  .countdown{font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .countdown.locked{color:var(--hot)}
  .avatars{display:flex}
  .avatars span{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface-2);border:2px solid var(--surface);margin-left:-7px}
  .avatars span:first-child{margin-left:0}

  /* ---------- Detail ---------- */
  .back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-weight:700;font-size:14px;font-family:'Space Grotesk',sans-serif}
  .back-btn svg{width:16px;height:16px}
  .detail-head{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
  .big-q{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600;letter-spacing:-.005em;overflow-wrap:anywhere}

  .opt-grid{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
    padding:16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);
    font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:16px;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .opt:active{transform:scale(.99)}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:0 0 0 1px var(--accent),0 6px 18px -10px var(--accent-glow)}
  .opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);flex-shrink:0}
  .opt[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
  .yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .yesno .opt{justify-content:center;font-size:19px;padding:22px 0}

  .num-wrap{display:flex;flex-direction:column;gap:10px}
  .num-input{width:100%;text-align:center;font-family:'DM Mono',monospace;font-size:36px;font-weight:500;padding:18px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);-moz-appearance:textfield}
  .num-input:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 22px -12px var(--accent-glow);outline:none}
  .num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none}
  .num-steppers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .num-steppers button{padding:12px 0;border-radius:12px;background:var(--surface-2);font-family:'DM Mono',monospace;font-weight:500;box-shadow:0 2px 0 var(--line-strong)}
  .num-steppers button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

  .stake-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;background:var(--gold-bg);color:var(--gold-deep);font-family:'Space Grotesk',sans-serif;font-weight:600;margin:16px 0 12px}

  .locked-box{display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;padding:22px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:14px}
  .locked-box .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .locked-box .val{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600}

  .info-banner{display:flex;gap:9px;align-items:flex-start;padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.45;margin-bottom:14px}
  .info-banner.pending{background:color-mix(in srgb,var(--hot) 11%,transparent);border:1px solid color-mix(in srgb,var(--hot) 28%,transparent);color:var(--ink-soft)}
  .info-banner.neutral{background:var(--surface-2);color:var(--ink-soft)}
  .info-banner strong{color:var(--ink)}

  /* ---------- Result ---------- */
  .result-hero{text-align:center;padding:26px 12px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .result-headline{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:36px;letter-spacing:-.01em;line-height:1}
  .result-headline.win{color:var(--win)}
  .result-headline.void{color:var(--void)}
  .result-payout{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:52px;letter-spacing:-.02em}
  .result-payout.win{color:var(--gold-deep)}
  .xp-pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;padding:6px 14px;border-radius:999px}
  .levelup{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.04em;animation:pulse 1s ease infinite alternate}
  @keyframes pulse{to{transform:scale(1.06)}}
  .kv-list{display:flex;flex-direction:column}
  .kv{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--ink-soft)}
  .kv .v{font-weight:600}
  .kv .v .arrow{color:var(--ink-faint);margin:0 6px}
  .delta-up{color:var(--win);font-weight:700}

  /* ---------- Forms ---------- */
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
  .field label{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:500;color:var(--ink-soft)}
  .field .opt-lbl{color:var(--ink-faint);font-weight:400}
  .hint{font-size:12px;color:var(--ink-faint);line-height:1.45}
  .text-input,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px;resize:vertical}
  .text-input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 22px -12px var(--accent-glow);outline:none}
  .seg{display:flex;gap:7px;flex-wrap:wrap}
  .seg button{padding:10px 13px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:13px}
  .seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -10px var(--accent-glow)}
  .opt-editor{display:flex;flex-direction:column;gap:8px}
  .opt-editor .row{display:flex;gap:8px}
  .opt-editor .row input{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface)}
  .opt-editor .row button{width:44px;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:700;color:var(--ink-soft)}
  .range-row{display:flex;align-items:center;gap:10px}
  .range-row input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);text-align:center;font-family:'DM Mono',monospace}

  /* ---------- "Läuft bis" ---------- */
  .dur-box{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:14px}
  .dur-read{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .dur-read .big{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px}
  .dur-read .sub{font-family:'DM Mono',monospace;font-size:12px;color:var(--accent)}
  input[type=range].dur-slider{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;
    background:linear-gradient(90deg,var(--accent) 0 var(--p,50%),var(--surface-2) var(--p,50%) 100%);
    outline:none;margin:4px 0 2px;
  }
  input[type=range].dur-slider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
    background:var(--accent);border:3px solid var(--surface);cursor:pointer;
    box-shadow:0 0 0 1px var(--accent),0 4px 14px -4px var(--accent-glow);
  }
  input[type=range].dur-slider::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);
    cursor:pointer;box-shadow:0 0 0 1px var(--accent);
  }
  .dur-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-faint);
    font-family:'DM Mono',monospace;margin-top:6px}
  .dur-modes{display:flex;gap:6px;margin-bottom:10px}
  .dur-modes button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);
    font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:12.5px;color:var(--ink-soft)}
  .dur-modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
  .dur-box input[type=datetime-local]{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line-strong);
    background:var(--surface-2);font-size:14px;color:var(--ink)}
  .dur-box input[type=datetime-local]:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);outline:none}

  .radio-list{display:flex;flex-direction:column;gap:8px}

  /* ---------- "Läuft bis" — Slider-Stufen (1 Min … 24 Std). Längere Zeiträume via Datum/Uhrzeit. ---------- */
  const MS_MIN = 60e3, MS_HR = 3600e3, MS_DAY = 86400e3, MS_YEAR = 365*86400e3;
  const DURATION_STEPS = [
    1*MS_MIN, 5*MS_MIN, 10*MS_MIN, 15*MS_MIN, 30*MS_MIN, 45*MS_MIN,
    1*MS_HR, 1.5*MS_HR, 2*MS_HR, 2.5*MS_HR, 3*MS_HR, 3.5*MS_HR, 4*MS_HR, 5*MS_HR,
    6*MS_HR, 8*MS_HR, 10*MS_HR, 12*MS_HR, 16*MS_HR, 20*MS_HR, 24*MS_HR
  ];
  const DUR_MAX_MS = MS_YEAR; // harte Obergrenze, auch fürs Datum
  function snapDurationIndex(ms){
    let best = 0, bd = Infinity;
    DURATION_STEPS.forEach((s,i)=>{ const dd = Math.abs(s - ms); if(dd < bd){ bd = dd; best = i; } });
    return best;
  }
  function fmtDur(ms){
    if(ms < MS_HR) return Math.round(ms/MS_MIN) + " Min";
    if(ms < MS_DAY){ const h = ms/MS_HR; return (Number.isInteger(h) ? h : h.toFixed(1).replace(".",",")) + " Std"; }
    if(ms < 7*MS_DAY){ const d = Math.round(ms/MS_DAY); return d + (d===1 ? " Tag" : " Tage"); }
    if(ms < 60*MS_DAY){ const w = Math.round(ms/(7*MS_DAY)); return w + (w===1 ? " Woche" : " Wochen"); }
    if(ms < MS_YEAR){ const mo = Math.round(ms/(30*MS_DAY)); return mo + (mo===1 ? " Monat" : " Monate"); }
    return "1 Jahr";
  }
  function fmtEndStamp(atMs){
    const d = new Date(atMs), now = new Date();
    const t = d.toLocaleTimeString("de-DE",{ hour:"2-digit", minute:"2-digit" });
    if(d.toDateString() === now.toDateString()) return "endet " + t + " Uhr";
    if(atMs - Date.now() < 7*MS_DAY) return "endet " + d.toLocaleDateString("de-DE",{ weekday:"short" }) + ", " + t + " Uhr";
    return "endet " + d.toLocaleDateString("de-DE",{ day:"numeric", month:"short", year:"numeric" });
  }
  function toLocalInput(ms){ // timestamp -> value für <input type="datetime-local">
    const d = new Date(ms - new Date().getTimezoneOffset()*60000);
    return d.toISOString().slice(0,16);
  }
  // Enddatum eines Entwurfs (ms). In Sessions mit Endzeit gedeckelt.
  function draftEndMs(d){
    const base = (d.endMode === "datetime" && d.endAt) ? d.endAt : Date.now() + (d.durationMs || 10*MS_MIN);
    const cap = draftMaxEndMs(d);
    return Math.min(base, cap);
  }
  function draftMaxEndMs(d){
    let cap = Date.now() + DUR_MAX_MS;
    if(d.sessionId){ const s = sessionById(d.sessionId); if(s && s.endsAt) cap = Math.min(cap, s.endsAt); }
    return cap;
  }

  function botAnswerFor(ch){
    if(ch.type==="NUMBER"){
      const hasRange = ch.num && ch.num.min!=null && ch.num.max!=null;
      const lo = hasRange ? ch.num.min : 0;
      const hi = hasRange ? ch.num.max : (ch.num && ch.num.center ? ch.num.center*2 : 30);
      const span = Math.max(0.5, hi-lo);
      const c = ch.num && ch.num.center!=null ? ch.num.center : lo + span/2;
      const raw = Math.max(0, c + (Math.random()-0.5)*span*0.9);
      return String(numDec(ch) ? round2(raw) : Math.round(raw));
    }
    const keys = ch.options.map(o=>o.key);
    if(Math.random()<0.55) return ch._fav || (ch._fav = pickR(keys));
    return pickR(keys);
  }

  /* =========================================================
     ECONOMY — one payout model.
     Winner = correct answer (exact types) or closest guess (NUMBER, ties count).
     Reward per winner = wagerCp × rarityFactor, where
        rarityFactor = clamp(totalParticipants / winnerCount, floorMult, capMult)
     i.e. "belohnung ≈ Einsatz ÷ Anteil richtiger Tipper". Wrong tips get 0
     (their stake is simply gone — no pool, no bank, no sink shown).
  ========================================================= */
  function rarityFactor(participantCount, winnerCount){
    if(!winnerCount) return 0;
    return Math.min(CONFIG.payout.capMult, Math.max(CONFIG.payout.floorMult, participantCount / winnerCount));
  }
  // NUMBER: gestaffelte Auszahlung. p.rank ist der Distanz-Rang (1 = am nächsten, Gleichstand teilt sich).
  // Topf = base × Teilnehmerzahl, wird auf die ersten drei Distanz-Ränge nach numberPlaces verteilt.
  function gradedNumberPayouts(parts, base){
    const N = parts.length;
    const pot = base * N;
    const w = CONFIG.payout.numberPlaces;
    const out = {}; parts.forEach(p => out[p.id] = 0);
    const groups = {};
    parts.forEach(p => (groups[p.rank] = groups[p.rank] || []).push(p));
    const ranks = Object.keys(groups).map(Number).sort((a,b)=>a-b);
    if(ranks.length <= 1){                       // alle gleich weit weg -> Topf gleich teilen
      const each = Math.floor(pot / N);
      parts.forEach(p => out[p.id] = each);
      return out;
    }
    ranks.forEach((rk, idx) => {
      if(idx >= w.length) return;
      const grp = groups[rk];
      let each = Math.floor(pot * w[idx] / grp.length);
      if(idx === 0) each = Math.max(each, Math.round(base * CONFIG.payout.floorMult)); // Nächste:r kriegt mind. 1,5×
      grp.forEach(p => out[p.id] = each);
    });
    return out;
  }
  function computePayouts(ch){
    if(ch.type === "NUMBER"){
      const payouts = gradedNumberPayouts(ch.participants, ch.wagerCp);
      const top = ch.participants.filter(p => p.rank === 1)[0];
      const factor = top ? Math.round((payouts[top.id] / ch.wagerCp) * 100) / 100 : 0;
      return { payouts, factor, reward: top ? payouts[top.id] : 0 };
    }
    const winners = ch.participants.filter(p => p.correct);
    const factor = rarityFactor(ch.participants.length, winners.length);
    const reward = Math.round(ch.wagerCp * factor);
    const payouts = {};
    winners.forEach(w => { payouts[w.id] = reward; });
    return { payouts, factor: Math.round(factor * 100) / 100, reward };
  }
  // "Gewinn bei Treffer" preview for the pick screen (exact-match types only)
  function projectedWin(ch, pickKey){
    if(!pickKey || ch.type === "NUMBER") return null;
    const N = ch.participants.length + 1;
    const sameSide = ch.participants.filter(p => p.answer === pickKey).length + 1;
    const factor = rarityFactor(N, sameSide);
    return { cp: Math.round(ch.wagerCp * factor), factor: Math.round(factor * 100) / 100 };
  }

  function rankParticipants(ch, outcome){
    if(ch.type === "NUMBER"){
      const wd = ch.participants.map(p => ({ p, d: Math.abs(parseNum(p.answer) - parseNum(outcome)) }));
      const uniq = [...new Set(wd.map(x=>x.d))].sort((a,b)=>a-b);
      wd.forEach(x => { x.p.rank = uniq.indexOf(x.d) + 1; x.p.correct = (x.p.rank === 1); });
      return;
    }
    ch.participants.forEach(p => { p.correct = (p.answer === outcome); p.rank = p.correct ? 1 : 2; });
  }
  function chooseOutcome(ch, override){
    if(override !== undefined && override !== null && override !== ""){
      if(ch.type !== "NUMBER") return override;
      const n = parseNum(override);
      return String(isNaN(n) ? 0 : Math.max(0, normNum(n, ch)));
    }
    if(ch.type === "NUMBER"){
      const nums = ch.participants.map(p=>parseNum(p.answer)).filter(x=>!isNaN(x));
      const avg = nums.length ? nums.reduce((s,x)=>s+x,0)/nums.length : 0;
      const o = Math.max(0, avg + (Math.random()-0.5) * Math.max(1, avg*0.15) * 2);
      return String(normNum(o, ch));
    }
    return pickR(ch.options.map(o=>o.key));
  }

  function resolveChallenge(ch, override){
    if(ch.status === "RESOLVED" || ch.status === "VOID") return;
    if(ch.sessionId) return resolveSessionChallenge(ch, override);
    const outcome = chooseOutcome(ch, override);
    const pool = ch.participants.length * CONFIG.wagerCp;
    const you = ch.participants.find(p => p.id === "you");

    rankParticipants(ch, outcome);
    const winners = ch.participants.filter(p => p.correct);
    const zeroWinners = (ch.type !== "NUMBER") && winners.length === 0;
    const tooFew = ch.participants.length < CONFIG.minParticipants;

    ch.outcome = outcome;
    ch.resolvedAt = Date.now();

    if(tooFew || (zeroWinners && CONFIG.voidOnZeroWinners)){
      ch.status = "VOID"; ch.payoutState = "refunded";
      ch.voidReason = tooFew ? "Zu wenige Teilnehmer" : "Niemand lag richtig";
      // keep p.correct / p.rank so the recap can still show tips vs. outcome
      ch.participants.forEach(p => { p.payoutCp = p.wagerCp; });
      if(you) state.wallet.balanceCp += you.wagerCp;
      ui.result = { chId:ch.id, voided:true, reason: ch.voidReason, outcome, youPlayed: !!you };
      save(); return;
    }

    const res = computePayouts(ch);
    ch.participants.forEach(p => { p.payoutCp = res.payouts[p.id] || 0; });
    ch.factor = res.factor;
    ch.status = "RESOLVED"; ch.payoutState = "paid";

    const scoreBefore = state.stats.predictionScore;
    const validBefore = state.stats.validCount;
    if(you){
      state.wallet.balanceCp += you.payoutCp;
      state.stats.totalCpWon += you.payoutCp;   // NUMBER: auch Platz 2/3 zählen als gewonnene CP
      state.stats.validCount += 1;
      if(you.correct) state.stats.correctCount += 1;
      state.stats.predictionScore = Math.round(state.stats.correctCount / state.stats.validCount * 100);
      // fuer die offizielle Community-Wertung zaehlen nur oeffentliche Challenges
      // mit genug unabhaengigen Tipper:innen (Kollusions-/Farming-Schutz).
      if(ch.visibility==="PUBLIC" && ch.participants.length >= CONFIG.ranking.minTippersForEligibility)
        state.stats.publicValidCount = (state.stats.publicValidCount||0) + 1;
    }
    ch.participants.filter(p=>p.isBot).forEach(p=>{
      const b = state.bots.find(x=>x.id===p.id);
      if(b){ b.validCount += 1;
        if(p.correct) b.score = Math.min(96, b.score + (Math.random()<0.5?1:0));
        else b.score = Math.max(28, b.score - (Math.random()<0.3?1:0)); }
    });

    // Ersteller:in-Bonus: eigene, saubere Challenge mit genug Mitspieler:innen -> Qualitaets-CP.
    let creatorBonus = 0;
    if(ch.mine && !ch.sessionId && !ch.qualityBonusGiven
       && ch.participants.length >= CONFIG.create.qualityMinParticipants){
      creatorBonus = CONFIG.create.qualityBonusCp;
      ch.qualityBonusGiven = true;
      state.wallet.balanceCp += creatorBonus;
      state.stats.totalCpWon += creatorBonus;
      toast("+" + creatorBonus + " CP – deine Challenge lief gut");
    }

    ui.result = {
      chId:ch.id, voided:false, outcome, youPlayed:!!you,
      youAnswer: you?you.answer:null, youCorrect: you?you.correct:null,
      youRank: you?you.rank:null, isNumber: ch.type==="NUMBER",
      payout: you ? you.payoutCp : 0,
      factor: res.factor, creatorBonus,
      scoreBefore, scoreAfter:state.stats.predictionScore, validBefore,
      streakAfter: state.stats.currentStreak,
      winners: ch.participants.filter(p=>p.payoutCp>0).length
    };
    save();
  }

  /* ---------- disputes ---------- */
  function undoUserSettlement(ch){
    const you = ch.participants.find(p=>p.id==="you");
    if(!you) return;
    if(ch.status==="RESOLVED" && ch.payoutState==="paid"){
      state.wallet.balanceCp -= you.payoutCp;
      state.stats.totalCpWon = Math.max(0, state.stats.totalCpWon - you.payoutCp);
      state.stats.validCount = Math.max(0, state.stats.validCount - 1);
      if(you.correct) state.stats.correctCount = Math.max(0, state.stats.correctCount - 1);
      state.stats.predictionScore = state.stats.validCount>0
        ? Math.round(state.stats.correctCount / state.stats.validCount * 100) : 0;
    }
  }
  function raiseDispute(ch, reason, detail){
    ch.disputes = ch.disputes || [];
    ch.disputes.push({ reason, detail:detail||"", by:"you", at:Date.now() });
    if(Math.random() < 0.4) ch.disputes.push({ reason:"ambiguous", detail:"", by:"bot", at:Date.now() });
    const pc = ch.participants.length;
    const escalated = ch.disputes.length >= CONFIG.disputeEscalationMinCount
      || ch.disputes.length > pc * CONFIG.disputeEscalationParticipantPct;
    ch.disputeStatus = escalated ? "escalated" : "open";
    save();
  }
  // After a dispute on a VOID challenge: creator enters the correct outcome and it resolves properly.
  function reopenAndResolve(ch, override){
    const you = ch.participants.find(p => p.id === "you");
    if(ch.status === "VOID" && ch.payoutState === "refunded" && you){
      state.wallet.balanceCp -= you.wagerCp; // take back the void-refund; resolveChallenge re-settles
    }
    ch.status = "PENDING_RESOLUTION"; ch.payoutState = "none"; ch.voidReason = null;
    ch.participants.forEach(p => { p.payoutCp = 0; });
    resolveChallenge(ch, override);
    ch.disputeStatus = ch.status === "VOID" ? "rejected" : "resolved_after_dispute";
    save();
  }

  function decideDispute(ch, decision){
    if(decision === "reject"){
      ch.disputeStatus = "rejected";
    } else {
      undoUserSettlement(ch);
      const you = ch.participants.find(p=>p.id==="you");
      if(you) state.wallet.balanceCp += you.wagerCp;
      ch.participants.forEach(p => { p.payoutCp = p.wagerCp; });
      ch.status = "VOID"; ch.payoutState = "refunded"; ch.disputeStatus = "void";
      ch.voidReason = "Nach Einspruch für ungültig erklärt";
      if(ui.result && ui.result.chId === ch.id) ui.result = null;
    }
    save();
  }

     actions

  /* =========================================================
     STANDORT / ORTSBEZOGENE CHALLENGES
  ========================================================= */
  const placeById = id => PLACES.find(p => p.id === id) || null;
  function distKm(a, b){
    if(!a || !b || a.lat==null || b.lat==null) return null;
    const R = 6371, toR = d => d*Math.PI/180;
    const dLat = toR(b.lat-a.lat), dLng = toR(b.lng-a.lng);
    const s = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
    return R * 2 * Math.asin(Math.sqrt(s));
  }
  const kmLabel = n => n==null ? "" : (n < 1 ? "<1 km" : Math.round(n) + " km");
  const locOn = () => !!(state && state.locationEnabled);          // Master-Schalter an?
  const locActive = () => locOn() && !!state.location;             // an UND Ort gewählt?
  function myPlace(){ return state.location ? placeById(state.location.placeId) : null; }
  function locRef(){ const p = myPlace(); return p ? { lat:p.lat, lng:p.lng } : null; }
  function nearRadius(ch){
    if(!ch.place) return false;
    const d = distKm(locRef(), ch.place);
    return d != null && d <= CONFIG.location.radiusKm;
  }
  function shareLocation(){
    // Picker sofort öffnen (kein Warten). GPS läuft parallel; kommt eine Position,
    // wird der Picker mit Entfernungen neu gerendert.
    state.locationEnabled = true; save();   // Standort-Auswahl bedeutet: Feature an
    ui._gps = null;
    ui.modal = { kind:"placePicker", gps:false, token:uid() };
    render();
    const tok = ui.modal.token;
    const gotGps = (coords) => {
      if(!ui.modal || ui.modal.kind!=="placePicker" || ui.modal.token!==tok) return;
      ui._gps = coords; ui.modal.gps = true;
      MODAL_SHOWN_FOR = null; render();  // Picker mit GPS-Distanzen neu aufbauen
    };
    try{
      if(!navigator.geolocation) return;
      let done = false;
      const t = setTimeout(()=>{ done = true; }, 6000);
      navigator.geolocation.getCurrentPosition(
        pos => { if(done) return; clearTimeout(t); gotGps({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
        ()  => { if(done) return; clearTimeout(t); },
        { enableHighAccuracy:false, timeout:5500, maximumAge:600000 }
      );
    }catch(e){ /* Picker ist schon offen – ohne GPS weiter */ }
  }
  function setMyPlace(placeId){
    const p = placeById(placeId); if(!p) return;
    state.location = { placeId:p.id, lat:p.lat, lng:p.lng,
      realLat: ui._gps ? ui._gps.lat : null, realLng: ui._gps ? ui._gps.lng : null,
      gps: !!ui._gps, sharedAt: Date.now() };
    ui.modal = null;
    ensureNearbyLocationChallenges();
    save();
    toast("Standort: " + p.name);
    render();
  }
  function setLocationEnabled(on){
    state.locationEnabled = !!on;
    if(!on) state.location = null;   // aus = Ort verwerfen
    save();
    if(on){ shareLocation(); }       // an = direkt Ort wählen
    else { toast("Standort aus"); render(); }
  }
  function clearLocation(){ state.locationEnabled = false; state.location = null; save(); toast("Standort aus"); render(); }

  function makeLocationChallenge(place, def, byBot){
    const now = Date.now();
    const options = def.type==="YES_NO" ? yesnoOpts() : (def.opts||[]).map(mkOpt);
    const creator = byBot ? pickR(state.bots) : null;
    const ch = {
      id:uid(), code:shortcode(), question:def.q, type:def.type, options,
      category:"Real Life", visibility:"PUBLIC",
      createdBy: creator ? creator.name : state.user.username, creatorId: creator ? creator.id : "you",
      mine: !creator, status:"OPEN", createdAt:now, durationMs:(def.dur||30*60e3), locksAt: now + (def.dur||30*60e3),
      wagerCp: CONFIG.wagerCp, outcome:null, resolvedAt:null, payoutState:"none",
      daily:false, live:false, num: def.type==="NUMBER" ? {min:0,max:30,center:8,dec:false} : null,
      place: { id:place.id, name:place.name, icon:place.icon, kind:place.kind, lat:place.lat, lng:place.lng },
      participants:[], disputes:[], disputeStatus:null
    };
    if(creator) seedBots(ch, rint(2,6));
    return ch;
  }
  function ensureNearbyLocationChallenges(){
    if(!locActive()) return;
    const open = state.challenges.filter(c => c.place && c.status==="OPEN" && nearRadius(c));
    if(open.length >= 2) return;
    const here = myPlace();
    const nearbyPlaces = PLACES.filter(p => { const d = distKm(locRef(), p); return d != null && d <= CONFIG.location.radiusKm; });
    const pool = nearbyPlaces.length ? nearbyPlaces : [here];
    let added = 0;
    while(added < 2 - open.length){
      const pl = pickR(pool);
      const ideas = PLACE_IDEAS[pl.kind] || PLACE_IDEA_FALLBACK;
      state.challenges.unshift(makeLocationChallenge(pl, pickR(ideas), true));
      added++;
    }
  }
  function applyStreakForToday(){
    const s = state.stats, t = todayStr();
    if(s.lastActiveDate === t) return;
    s.currentStreak = (s.lastActiveDate === yesterdayStr()) ? s.currentStreak + 1 : 1;
    s.longestStreak = Math.max(s.longestStreak, s.currentStreak);
    s.lastActiveDate = t;
  }
  function submitPrediction(ch, answer){
    if(ch.mine && !ch.sessionId) return toast("Auf die eigene Challenge kannst du nicht tippen");
    if(ch.participants.some(p=>p.id==="you")) return toast("Du hast hier schon getippt");
    if(Date.now() >= ch.locksAt || ch.status!=="OPEN") return toast("Challenge ist gesperrt");
    if(ch.sessionId){
      ch.participants.push({ id:"you", name:state.user.username, avatar:state.user.avatar, isBot:false,
        answer, wagerCp:0, correct:null, rank:null, payoutCp:0 });
      const s = sessionById(ch.sessionId); const me = s && sessionMe(s); if(me) me.tips = (me.tips||0)+1;
      save(); toast("Tipp abgegeben");

    state.wallet.balanceCp -= ch.wagerCp;

      answer, wagerCp:ch.wagerCp, correct:null, rank:null, payoutCp:0 });

  /* =========================================================
     MODERATION — prototype rule/keyword check for user-created
     challenges. Returns null (ok) or a short reason string.
     (Im echten Produkt zusätzlich KI-Klassifikation, siehe Plan P.)
  ========================================================= */
  function moderateChallengeText(raw, relaxed){
    const t = " " + String(raw || "").toLowerCase()
      .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
      .replace(/[^a-z0-9€\s]/g," ").replace(/\s+/g," ") + " ";

    // 1) Immer blockieren: Slurs / klare Beleidigungen / Hetze / sexualisiert
    const hard = ["nigger","neger","kanake","schlitzauge","zigeuner","judensau","untermensch",
      "hurensohn","wichser","fotze","missgeburt","schwuchtel","fettsack","fette sau",
      "fettes schwein","dumme sau","haessliche sau","spasti","mongo","vergasen","vergast",
      "schwein von nebenan","behinderte[rs]? ",
      "titten","moepse","schwanz von","nacktbild","nacktfoto","porno","wird .{0,15}ficken","blaest .{0,10}(ihm|ihr)","wichsen"];
    for(const w of hard) if(new RegExp("(^| )"+w).test(t))
      return "Beleidigende, diskriminierende oder sexualisierte Sprache ist in CHALLENGE nicht erlaubt.";

    // 2) Echtgeldwetten
    if(/(wetten? um (echtes )?geld|echtgeld|um bargeld|einsatz in euro|gewinn auszahlen|um \d+ ?(euro|€))/.test(t))
      return "Wetten um echtes Geld sind in CHALLENGE nicht erlaubt.";

    // In privaten Sessions dürfen Mitglieder namentlich vorkommen -> Regel 3 + 4 entfallen,
    // Slurs/Sexuelles/Gewalt/Doxxing/Echtgeld (oben + unten) bleiben.
    if(relaxed){
      if(/(^| )(umbringen|abstechen|zusammenschlagen|verpruegeln|totschlagen)( |$)/.test(t))
        return "Gewaltandrohungen sind nicht erlaubt.";
      if(/(adresse von|telefonnummer|handynummer|klarname von)/.test(t))
        return "Das Teilen privater Daten ist nicht erlaubt.";
      return null;
    }

    // 3) Persönliches Merkmal einer konkreten, identifizierbaren Person
    const nearbyDeixis = /(am nebentisch|nebenan|neben (mir|uns)|\b(dort|drueben|gegenueber)\b|vor mir|hinter mir|da vorne|an der bar|neben mir am tisch)/.test(t);
    const personToken = /\b(die|der|dem|den|diese[rn]?|jene[rn]?|eine bestimmte) (person|frau|dame|mann|herr|typ|kerl|junge|maedchen|kellner(in)?|gast|kunde|kundin|nachbar(in)?|fremde[rn]?)\b/.test(t);
    const personDeictic = /\b(person|frau|dame|mann|herr|typ|kerl|junge|maedchen|kellner(in)?|gast|kunde|kundin|nachbar(in)?) (da|dort|hier|drueben|nebenan|gegenueber|vorne|hinten)\b/.test(t);
    const personRef = /(am nebentisch|diese person|eine bestimmte person)/.test(t) || personDeictic || (personToken && nearbyDeixis);
    const sensitive = /(zu (dick|duenn|fett|duerr|haesslich)|uebergewicht|wie (alt|schwer) (ist|sieht|die)|wie viel wiegt|wieviel wiegt|(sein|ihr|dessen) gewicht|(sein|ihr) aussehen|haesslich|attraktiv genug|schoen genug|woher (sie|er|die person|der|das) (kommt|stammt|kommen)|welche (religion|herkunft|nationalitaet|hautfarbe|sexualitaet|konfession)|\b(migrationshintergrund|hautfarbe|konfession)\b|\b(schwul|lesbisch|homosexuell|transgender|bisexuell|jungfrau)\b|wie viel verdient|(sein|ihr) (einkommen|gehalt)|(ist (sie|er|die person)) (krank|behindert|psychisch)|(sein|ihr) iq|intelligent genug|beziehungsstatus|\bgewaehlt\b|\bwaehlt\b|welche partei|parteimitglied|waehler(in)?\b|politische (meinung|einstellung|gesinnung|richtung)|politisch (links|rechts)|\b(afd|npd|nazi|rechtsextrem|linksextrem|reichsbuerger)\b)/.test(t);
    if(personRef && sensitive)
      return "Fragen über persönliche Merkmale einer bestimmten Person (Aussehen, Gewicht, Alter, Herkunft, Religion, Sexualität, politische Meinung …) sind in CHALLENGE nicht erlaubt.";
    if(/(ist|sieht) .{0,25}(zu dick|zu fett|haesslich|widerlich|abstossend|eklig)/.test(t)
       && /(person|mann|frau|typ|kerl|dame|herr|gast|kunde|kundin|kellner|nachbar|kollege|maedchen|junge)/.test(t))
      return "Herabwürdigende Aussagen über echte Personen sind in CHALLENGE nicht erlaubt.";

    // 4) Zu subjektiv / potenziell herabwuerdigend
    if(/(wer|welche[rs]?)\b.{0,25}\b(sieht|schaut|wirkt)\b.{0,25}(am (coolsten|haesslichsten|schoensten|dicksten|duemmsten|attraktivsten|fettesten|sexiesten) aus|(schoener|haesslicher|cooler|dicker|duemmer|fetter|attraktiver|sexier) aus)/.test(t))
      return "Diese Frage ist zu wertend und nicht eindeutig auflösbar – bitte sachlich und klar formulieren.";

    // 5) Gewalt / Drohung
    if(/(^| )(umbringen|abstechen|zusammenschlagen|verpruegeln|totschlagen|aufmischen|fertigmachen|fertig machen|abziehen)( |$)/.test(t))
      return "Gewaltandrohungen sind in CHALLENGE nicht erlaubt.";

    // 6) Doxxing / private Daten
    if(/(adresse von|telefonnummer|handynummer|wo wohnt|wohnort von|echter? name von|klarname von)/.test(t))
      return "Das Teilen privater Daten (Name, Adresse, Telefonnummer) ist in CHALLENGE nicht erlaubt.";

    return null;
  }
  function moderateDraft(d){
    const opts = (d.options || []).join(" ");
    return moderateChallengeText(d.question + " " + opts, !!(d.sessionId || d.liveGroup));
  }

  function publishDraft(){
    const d = ui.draft;
    if(!d.question.trim()) return toast("Bitte eine Frage eingeben");
    const modReason = moderateDraft(d);
    if(modReason){ d.blocked = modReason; d.preview = false; toast("Challenge nicht erlaubt – Hinweis oben"); render(); return; }
    if(d.liveGroup){
      toast("Challenge wird erstellt …");
      lgPostChallenge(d).then(()=>{ ui.draft = null; toast("In der Gruppe"); go("liveGroup"); })
        .catch(err=>toast(String(err.message||err)));
      return;
    }
    let options = [];
    if(d.type === "YES_NO") options = yesnoOpts();
    else if(d.type === "NUMBER") options = [];
    else {
      options = d.options.filter(x=>x.trim()).map(mkOpt);
      if(options.length < 2) return toast("Mindestens 2 Antwortmöglichkeiten");
    }
    const now = Date.now();
    const endAt = draftEndMs(d);
    if(endAt <= now + 30e3) return toast("Der Endzeitpunkt muss in der Zukunft liegen");
    const numObj = d.type==="NUMBER" ? { min:d.numMin, max:d.numMax, dec: !!d.numDec,
      center: (d.numMin!=null && d.numMax!=null) ? (d.numMin+d.numMax)/2 : null } : null;

    if(d.sessionId){
      const s = sessionById(d.sessionId);
      if(!s || s.status!=="active"){ toast("Session nicht aktiv"); return; }
      const ch = {
        id:uid(), code:shortcode(), question:d.question.trim(), type:d.type, options,
        category:d.category||"Session", visibility:"SESSION", createdBy: sessionMe(s).name, creatorId:"you", mine:true,
        sessionId:s.id, status:"OPEN", createdAt:now, durationMs: endAt-now, locksAt: endAt,
        wagerCp:0, outcome:null, resolvedAt:null, payoutState:"none", num:numObj,
        participants:[], disputes:[], disputeStatus:null
      };
      seedSessionBots(ch, s);
      s.challenges.unshift(ch);
      const me = sessionMe(s); if(me) me.created = (me.created||0)+1;
      ui.draft = null; save();
      maybeSessionBotChallenge(s);
      toast("Challenge erstellt");
      go("challenge", { chId: ch.id });
      return;
    }

    const atPlace = (d.atLocation && locActive()) ? myPlace() : null;
    const ch = {
      id:uid(), code:shortcode(), question:d.question.trim(), type:d.type, options,
      category: atPlace ? "Real Life" : d.category, visibility:d.visibility, createdBy:"you", mine:true,
      status:"OPEN", createdAt:now, durationMs: endAt-now, locksAt: endAt,
      wagerCp:CONFIG.wagerCp, outcome:null, resolvedAt:null, payoutState:"none",
      daily:false, live:d.category==="Live", num:numObj,
      place: atPlace ? { id:atPlace.id, name:atPlace.name, icon:atPlace.icon, kind:atPlace.kind, lat:atPlace.lat, lng:atPlace.lng } : null,
      participants:[], disputes:[], disputeStatus:null
    };
    seedBots(ch, atPlace ? rint(1,5) : rint(3,9));
    state.challenges.unshift(ch);
    state.stats.createdCount = (state.stats.createdCount||0) + 1;
    ui.draft = null;
    grantCreateRewardOnPublish(ch);
    go("challenge", { chId: ch.id });
  }

  // Belohntes Erstellen: kleiner Sofort-Bonus, gedeckelt pro Tag. Der groessere
  // Qualitaets-Bonus kommt erst bei der Aufloesung (genug Mitspieler:innen), siehe resolveChallenge.
  function createRewardsLeft(){
    const t = todayStr();
    if(state.stats.createRewardDate !== t){ state.stats.createRewardDate = t; state.stats.createRewardCount = 0; }
    return Math.max(0, CONFIG.create.maxRewardedPerDay - (state.stats.createRewardCount||0));
  }
  function grantCreateRewardOnPublish(ch){
    ch.createRewardGiven = false;
    if(createRewardsLeft() > 0){
      state.stats.createRewardDate = todayStr();
      state.stats.createRewardCount = (state.stats.createRewardCount||0) + 1;
      state.wallet.balanceCp += CONFIG.create.rewardCp;
      state.stats.totalCpWon += CONFIG.create.rewardCp;
      ch.createRewardGiven = true;
      save(); renderCpPill(true);
      toast("Veröffentlicht · +" + CONFIG.create.rewardCp + " CP fürs Erstellen");
    } else {
      save();
      toast("Veröffentlicht · Erstell-Bonus heute aufgebraucht (" + CONFIG.create.maxRewardedPerDay + "×)");
    }
  }

  /* =========================================================
     PRIVATE SESSIONS — eigener Raum, kein Einsatz/Limit,
     Punkte nach Seltenheit, nur internes Ranking, komplett
     getrennt vom Hauptprofil.
  ========================================================= */
  const SESSION_BASE = 100;
  const SESSION_NAMES = ["Runde bei Chris","Jungswochenende","Skiurlaub 2026","Grillabend","WG-Duell","Stammtisch"];

  /* =========================================================
     LIVE GRUPPEN-MODUS — echter Sync über Supabase (PostgREST).
     Nur aktiv, wenn eine Konfiguration hinterlegt ist (Einladungslink
     oder Setup-Formular). Ohne Konfiguration bleibt alles wie gehabt
     (Offline-Demo mit Bots). Kein Realtime – der Client fragt alle
     paar Sekunden selbst ab. Punkte werden aus den Tipps berechnet.
  ========================================================= */
  const LG = { cfg:null, playerId:null, groupId:null, data:null, lastHash:"", busy:false, err:null, pollAt:0,
    seen:null, seenMembers:null, seenInit:false, justActed:new Set() };
  function lgResetSeen(){ LG.seen = new Map(); LG.seenMembers = new Set(); LG.seenInit = false; LG.justActed = new Set(); }
  const lgOn = () => !!(LG.cfg && LG.cfg.url && LG.cfg.key);
  const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));

  function lgLoadCfg(){
    try{
      const hp = new URLSearchParams(location.hash.replace(/^#/,""));
      const raw = hp.get("cfg");
      if(raw){
        const j = JSON.parse(b64d(raw));
        if(j && j.url && j.key) localStorage.setItem("challenge_live_cfg", JSON.stringify({ url:String(j.url).replace(/\/+$/,""), key:String(j.key) }));
        const g = hp.get("g"); if(g) localStorage.setItem("challenge_live_pendinggroup", g.toUpperCase().slice(0,6));
        try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
      }
    }catch(e){}
    try{ LG.cfg = JSON.parse(localStorage.getItem("challenge_live_cfg")) || null; }catch(e){ LG.cfg = null; }
    try{
      LG.playerId = localStorage.getItem("challenge_player_id");
      if(!LG.playerId){ LG.playerId = "p_" + Math.random().toString(36).slice(2,11) + Date.now().toString(36); localStorage.setItem("challenge_player_id", LG.playerId); }
    }catch(e){ LG.playerId = "p_" + Math.random().toString(36).slice(2,11); }
    try{ LG.groupId = localStorage.getItem("challenge_live_group") || null; }catch(e){}
  }
  function lgSetCfg(url, key){
    url = String(url||"").trim().replace(/\/+$/,""); key = String(key||"").trim();
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)) return "Die Projekt-URL muss so aussehen: https://xxxx.supabase.co";
    if(key.length < 30 || key.includes(" ")) return "Der anon-Schlüssel sieht nicht richtig aus (langer Text ohne Leerzeichen).";
    LG.cfg = { url, key };
    try{ localStorage.setItem("challenge_live_cfg", JSON.stringify(LG.cfg)); }catch(e){}
    return null;
  }
  function lgClearCfg(){
    LG.cfg = null; LG.groupId = null; LG.data = null; LG.lastHash = "";
    try{ localStorage.removeItem("challenge_live_cfg"); localStorage.removeItem("challenge_live_group"); localStorage.removeItem("challenge_live_pendinggroup"); }catch(e){}
  }
  function lgInviteLink(){
    if(!lgOn()) return "";
    let u = location.origin + location.pathname + "#cfg=" + b64e(JSON.stringify(LG.cfg));
    if(LG.groupId) u += "&g=" + LG.groupId;
    return u;
  }

  const lgSleep = ms => new Promise(r => setTimeout(r, ms));
  async function lgReq(method, path, body, extra){
    if(!lgOn()) throw new Error("Live-Modus ist nicht eingerichtet.");
    const opts = {
      method,
      headers: Object.assign({
        "apikey": LG.cfg.key,
        "Authorization": "Bearer " + LG.cfg.key,
        "Content-Type": "application/json",
        "Prefer": (method === "POST" ? "return=representation" : "return=minimal")
      }, extra || {}),
      body: body ? JSON.stringify(body) : undefined
    };
    let res, netErr = false;
    // Bei wackligem Netz / kurzem Server-Hänger: einmal automatisch nochmal.
    for(let attempt = 0; attempt < 2; attempt++){
      try{
        res = await fetch(LG.cfg.url + "/rest/v1/" + path, opts);
        netErr = false;
      }catch(e){ netErr = true; }
      if(netErr){ if(attempt === 0){ await lgSleep(800); continue; } throw new Error("Keine Verbindung zum Server (Internet? URL korrekt?)."); }
      if(res.status >= 500 && attempt === 0){ await lgSleep(800); continue; }
      break;
    }
    if(!res.ok){
      let t = ""; try{ t = await res.text(); }catch(e){}
      if(res.status === 401 || res.status === 403) throw new Error("Zugriff abgelehnt – anon-Schlüssel prüfen, SQL-Skript ausgeführt?");
      if(res.status === 404) throw new Error("Tabelle nicht gefunden – SQL-Setup in Supabase ausgeführt?");
      throw new Error("Server-Fehler " + res.status + (t ? " · " + t.slice(0,120) : ""));
    }
    if(res.status === 204) return null;
    try{ return await res.json(); }catch(e){ return null; }
  }

  async function lgCreateGroup(name){
    const code = shortcode();
    await lgReq("POST", "groups", { id:code, name:(name||"").trim() || "Jungswochenende", host_id:LG.playerId });
    await lgEnterGroup(code);
    return code;
  }
  // Beitreten: prüft, ob mein Gerät die Gruppe schon kennt. Wenn nicht und es gibt
  // schon Mitglieder -> "Das bin ich"-Auswahl (status "claim"), sonst direkt rein.
  async function lgJoinGroup(code, opts){
    code = String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
    if(!code) throw new Error("Bitte einen Code eingeben.");
    const g = await lgReq("GET", "groups?id=eq." + code + "&select=id,status");
    if(!g || !g.length) throw new Error("Keine Gruppe mit dem Code " + code + ".");
    const members = await lgReq("GET", "members?group_id=eq." + code + "&select=*&order=joined_at.asc") || [];
    const iAmMember = members.some(m => m.player_id === LG.playerId);
    if(iAmMember || (opts && opts.asNew) || members.length === 0){
      await lgEnterGroup(code);
      return { status:"joined" };
    }
    ui.liveClaimGroup = code;
    ui.liveClaimMembers = members;
    ui.liveClaimPick = null;
    return { status:"claim" };
  }
  async function lgEnterGroup(code){
    await lgReq("POST", "members?on_conflict=group_id,player_id",
      { group_id:code, player_id:LG.playerId, name:(state.user.username||"Spieler").slice(0,20), avatar:state.user.avatar || "🦊" },
      { "Prefer": "resolution=merge-duplicates,return=minimal" });
    LG.groupId = code; LG.data = null; LG.lastHash = ""; lgResetSeen();
    try{ localStorage.setItem("challenge_live_group", code); localStorage.removeItem("challenge_live_pendinggroup"); }catch(e){}
    ui.liveClaimGroup = null; ui.liveClaimMembers = null; ui.liveClaimPick = null;
    await lgPoll(true);
  }
  // Bestehenden Platz übernehmen: player_id des gewählten Mitglieds wird meine.
  async function lgClaimAs(pid){
    const code = ui.liveClaimGroup;
    if(!code || !pid) return;
    LG.playerId = pid;
    try{ localStorage.setItem("challenge_player_id", pid); }catch(e){}
    LG.groupId = code; LG.data = null; LG.lastHash = ""; lgResetSeen();
    try{ localStorage.setItem("challenge_live_group", code); localStorage.removeItem("challenge_live_pendinggroup"); }catch(e){}
    ui.liveClaimGroup = null; ui.liveClaimMembers = null; ui.liveClaimPick = null;
    await lgPoll(true);
  }
  function lgLeaveGroup(){
    LG.groupId = null; LG.data = null; LG.lastHash = ""; lgResetSeen();
    try{ localStorage.removeItem("challenge_live_group"); }catch(e){}
  }

  async function lgPostChallenge(d){
    const endAt = draftEndMs(d);
    if(endAt <= Date.now() + 20e3) throw new Error("Der Endzeitpunkt muss in der Zukunft liegen.");
    const options = d.type === "YES_NO" ? yesnoOpts()
      : d.type === "NUMBER" ? []
      : d.options.filter(x=>x.trim()).map(mkOpt);
    if(d.type !== "YES_NO" && d.type !== "NUMBER" && options.length < 2) throw new Error("Mindestens 2 Antwortmöglichkeiten.");
    const id = uid();
    LG.justActed.add(id);
    await lgReq("POST", "challenges", {
      id, group_id:LG.groupId, creator_id:LG.playerId, creator_name:(state.user.username||"Spieler").slice(0,20),
      question:d.question.trim(), type:d.type, options,
      num_dec: d.type === "NUMBER" ? !!d.numDec : false,
      locks_at: new Date(endAt).toISOString()
    });
    await lgPoll(true);
    return id;
  }
  async function lgPostTip(chId, answer){
    await lgReq("POST", "tips?on_conflict=challenge_id,player_id",
      { challenge_id:chId, group_id:LG.groupId, player_id:LG.playerId,
        player_name:(state.user.username||"Spieler").slice(0,20), answer:String(answer) },
      { "Prefer": "resolution=ignore-duplicates,return=minimal" });
    await lgPoll(true);
  }
  async function lgResolve(chId, outcomeRaw){
    await lgPoll(true); // frische Tipps holen, bevor gewertet wird
    const c = ((LG.data && LG.data.challenges) || []).find(x=>x.id === chId);
    if(!c) throw new Error("Challenge nicht gefunden.");
    const wasResolved = c.status === "resolved";
    const tips = ((LG.data && LG.data.tips) || []).filter(t=>t.challenge_id === chId);
    const pseudo = {
      type:c.type, options:c.options || [], num:{ dec: !!c.num_dec },
      participants: tips.map(t=>({ id:t.player_id, answer:t.answer, correct:null, rank:null, payoutCp:0 }))
    };
    const outcome = chooseOutcome(pseudo, outcomeRaw);
    rankParticipants(pseudo, outcome);
    let factor = 0;
    if(pseudo.type === "NUMBER"){
      const payouts = gradedNumberPayouts(pseudo.participants, SESSION_BASE);
      pseudo.participants.forEach(p => p.payoutCp = payouts[p.id] || 0);
      const top = pseudo.participants.filter(p=>p.rank === 1)[0];
      factor = top ? Math.round((payouts[top.id] / SESSION_BASE) * 100) / 100 : 0;
    } else {
      const winners = pseudo.participants.filter(p=>p.correct);
      const f = winners.length ? Math.min(CONFIG.payout.capMult, Math.max(CONFIG.payout.floorMult, pseudo.participants.length / winners.length)) : 0;
      factor = Math.round(f * 100) / 100;
      pseudo.participants.forEach(p => p.payoutCp = p.correct ? Math.round(SESSION_BASE * f) : 0);
    }
    LG.justActed.add(chId);
    await lgReq("PATCH", "challenges?id=eq." + chId, { status:"resolved", outcome:String(outcome), factor });
    for(const p of pseudo.participants){
      await lgReq("PATCH", "tips?challenge_id=eq." + chId + "&player_id=eq." + encodeURIComponent(p.id),
        { correct: !!p.correct, rank: p.rank, points: p.payoutCp });
    }
    await lgPoll(true);
    return { outcome, factor, wasResolved };
  }
  async function lgEndGroup(){
    await lgPoll(true);
    const r = lgRanking();
    const w = r[0];
    await lgReq("PATCH", "groups?id=eq." + LG.groupId, { status:"ended", winner_id: w ? w.player_id : null, winner_name: w ? w.name : null });
    await lgPoll(true);
  }
  async function lgDeleteChallenge(id){
    const c = ((LG.data && LG.data.challenges) || []).find(x=>x.id === id);
    if(c && c.creator_id !== LG.playerId) throw new Error("Nur der:die Ersteller:in kann diese Challenge löschen.");
    if(lgTipsFor(id).length) throw new Error("Es wurde schon getippt – nicht mehr löschbar.");
    LG.justActed.add(id);
    await lgReq("DELETE", "challenges?id=eq." + id);
    if(LG.seen) LG.seen.delete(id);
    await lgPoll(true);
  }
  async function lgKick(pid){
    if(!lgIsHost()) throw new Error("Nur der Host kann Mitglieder entfernen.");
    await lgReq("DELETE", "members?group_id=eq." + LG.groupId + "&player_id=eq." + encodeURIComponent(pid));
    if(LG.seenMembers) LG.seenMembers.delete(pid);
    ui.lgKickPick = null;
    await lgPoll(true);
  }
  async function lgDeleteGroup(){
    if(!lgIsHost()) throw new Error("Nur der Host kann die Gruppe löschen.");
    await lgReq("DELETE", "groups?id=eq." + LG.groupId);  // cascade: members/challenges/tips
    lgLeaveGroup();
  }

  async function lgPoll(force){
    if(!lgOn() || !LG.groupId) return;
    if(LG.busy && !force) return;
    if(!force && Date.now() - LG.pollAt < 1500) return;
    LG.busy = true; LG.pollAt = Date.now();
    try{
      const gid = LG.groupId;
      const [g, members, challenges, tips] = await Promise.all([
        lgReq("GET", "groups?id=eq." + gid + "&select=*"),
        lgReq("GET", "members?group_id=eq." + gid + "&select=*&order=joined_at.asc"),
        lgReq("GET", "challenges?group_id=eq." + gid + "&select=*&order=created_at.desc"),
        lgReq("GET", "tips?group_id=eq." + gid + "&select=*")
      ]);
      if(!g || !g.length){ LG.err = null; toast("Gruppe wurde nicht gefunden."); lgLeaveGroup(); if(ui.route === "liveGroup" || ui.route === "liveChallenge") go("sessions"); return; }
      LG.data = { group:g[0], members:members || [], challenges:challenges || [], tips:tips || [] };
      LG.err = null;
      lgDetectChanges();
      const hash = JSON.stringify(LG.data);
      if(hash !== LG.lastHash){
        LG.lastHash = hash;
        if(ui.route === "home" || ui.route === "sessions" || ui.route === "liveGroup" || ui.route === "liveChallenge"){
          const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
          if(!typing){ const v = document.getElementById("view"), sc = v.scrollTop; RENDER_SILENT = true; render(); v.scrollTop = sc; }
        }
      }
    }catch(e){
      LG.err = String(e && e.message || e);
      if(ui.route === "home" || ui.route === "sessions" || ui.route === "liveGroup" || ui.route === "liveChallenge"){
        const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
        if(!typing){ RENDER_SILENT = true; render(); }
      }
    }finally{ LG.busy = false; }
  }

  // Live-Hinweise: neue / aufgelöste Challenges, neue Mitglieder. Beim ersten Abruf still.
  function lgDetectChanges(){
    if(!LG.data) return;
    if(!LG.seen) lgResetSeen();
    const first = !LG.seenInit;
    (LG.data.challenges || []).forEach(c=>{
      const prev = LG.seen.get(c.id);
      if(prev === undefined){
        if(!first && c.creator_id !== LG.playerId && !LG.justActed.has(c.id))
          toast("🆕 Neue Challenge – jetzt tippen!");
      } else if(prev !== "resolved" && c.status === "resolved"){
        if(!first && !LG.justActed.has(c.id)){
          const mine = (LG.data.tips || []).find(t => t.challenge_id === c.id && t.player_id === LG.playerId);
          const gain = (mine && mine.points > 0) ? " · +" + fmt(mine.points) + " Pkt" : "";
          toast("✅ Aufgelöst: " + lgOptLabel(c, c.outcome) + gain);
        }
      }
      LG.seen.set(c.id, c.status);
      LG.justActed.delete(c.id);
    });
    (LG.data.members || []).forEach(m=>{
      if(!LG.seenMembers.has(m.player_id)){
        if(!first && m.player_id !== LG.playerId) toast("👋 " + m.name + " ist dabei");
        LG.seenMembers.add(m.player_id);
      }
    });
    LG.seenInit = true;
  }

  const lgChStatus = c => c.status === "resolved" ? "resolved" : (Date.now() >= new Date(c.locks_at).getTime() ? "locked" : "open");
  function lgRanking(){
    const by = {};
    ((LG.data && LG.data.members) || []).forEach(m => by[m.player_id] = { player_id:m.player_id, name:m.name, avatar:m.avatar, points:0, correct:0, tips:0 });
    ((LG.data && LG.data.tips) || []).forEach(t => {
      const r = by[t.player_id] || (by[t.player_id] = { player_id:t.player_id, name:t.player_name, avatar:"🎯", points:0, correct:0, tips:0 });
      r.tips++; if(t.points != null) r.points += t.points; if(t.correct) r.correct++;
    });
    return Object.values(by).sort((a,b)=> b.points - a.points || b.correct - a.correct || b.tips - a.tips);
  }
  const lgMyTip = chId => ((LG.data && LG.data.tips) || []).find(t => t.challenge_id === chId && t.player_id === LG.playerId);
  const lgTipsFor = chId => ((LG.data && LG.data.tips) || []).filter(t => t.challenge_id === chId);
  const lgIsHost = () => !!(LG.data && LG.data.group && LG.data.group.host_id === LG.playerId);

  function lgOptLabel(c, key){
    if(c.type === "NUMBER") return fmtNum(parseNum(key));
    const o = (c.options || []).find(x => x.key === key);
    return o ? o.label : (key || "—");
  }
  function lgCountdown(c){
    const st = lgChStatus(c);
    if(st === "resolved") return "Aufgelöst";
    const ms = new Date(c.locks_at).getTime() - Date.now();
    if(ms <= 0) return "Gesperrt";
    if(ms < MS_HR){ const s = Math.floor(ms/1000); return "noch " + Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
    if(ms < MS_DAY) return "noch " + Math.round(ms/MS_HR) + " Std";
    const d = Math.round(ms/MS_DAY); return "noch " + d + (d===1 ? " Tag" : " Tagen");
  }
  function lgAutoJoin(){
    if(!lgOn() || !state || !state.user) return;
    let pending = null;
    try{ pending = localStorage.getItem("challenge_live_pendinggroup"); }catch(e){}
    if(pending && pending !== LG.groupId){
      lgJoinGroup(pending)
        .then(res=>{ if(res.status === "claim"){ go("liveClaim"); } else { toast("Gruppe beigetreten"); go("liveGroup"); } })
        .catch(err=>{ toast(String(err.message||err)); try{ localStorage.removeItem("challenge_live_pendinggroup"); }catch(e){} });
    } else if(LG.groupId){
      lgPoll(true);
    }
  }

  function sessionById(id){ return (state.sessions||[]).find(s=>s.id===id); }
  function sessionMe(s){ return s.members.find(m=>m.id==="you"); }
  function sessionRanking(s){
    return [...s.members].sort((a,b)=> (b.points||0)-(a.points||0) || (b.correct||0)-(a.correct||0) || (b.tips||0)-(a.tips||0));
  }
  function findChallengeAnywhere(id){
    let ch = state.challenges.find(c=>c.id===id);
    if(ch) return ch;
    for(const s of (state.sessions||[])){ ch = s.challenges.find(c=>c.id===id); if(ch) return ch; }
    return null;
  }
  function makeSessionMembers(hostName, hostAvatar){
    const bots = makeBots().sort(()=>Math.random()-0.5).slice(0, rint(3,5));
    return [
      { id:"you", name:hostName, avatar:hostAvatar, isBot:false, points:0, correct:0, tips:0, created:0 },
      ...bots.map(b=>({ id:b.id, name:b.name, avatar:b.avatar, isBot:true, points:0, correct:0, tips:0, created:0 }))
    ];
  }
  function createSession(name, endsAt){
    const s = { id:uid(), code:shortcode(), name: name.trim() || pickR(SESSION_NAMES),
      hostId:"you", createdAt:Date.now(), endsAt: endsAt||null, status:"active",
      members: makeSessionMembers(state.user.username, state.user.avatar),
      challenges: [], winnerId:null, endedAt:null };
    (state.sessions = state.sessions || []).unshift(s);
    for(let i=0;i<2;i++) botCreateSessionChallenge(s, true);
    save();
    return s;
  }
  function joinSessionByCode(code){
    // Prototyp: es gibt keine echte fremde Session -> wir simulieren eine, der du beitrittst
    const s = { id:uid(), code:(code||shortcode()).toUpperCase().slice(0,5), name: pickR(SESSION_NAMES),
      hostId:"bot_host", createdAt:Date.now()-rint(1,4)*3600e3, endsAt:null, status:"active",
      members: makeSessionMembers(state.user.username, state.user.avatar), challenges: [], winnerId:null, endedAt:null };
    s.members[1] && (s.members[1].id = "bot_host", s.members[1].name = "Host");
    // Mitglieder haben schon ein paar Punkte
    s.members.forEach(m=>{ if(m.isBot){ m.points = rint(0,600); m.correct = rint(0,6); m.tips = m.correct + rint(0,4); } });
    for(let i=0;i<3;i++) botCreateSessionChallenge(s, true);
    (state.sessions = state.sessions || []).unshift(s);
    save();
    return s;
  }

  const SESSION_CH_IDEAS = [
    ["Schafft {b} heute die 10 Bier?","YES_NO",null],
    ["Wer kotzt als Erstes?","PERSON","members"],
    ["Wer ist morgen als Letzter wach?","PERSON","members"],
    ["Wie viele Runden zahlt {b} heute?","NUMBER",null],
    ["Verschläft {b} morgen den Wecker?","YES_NO",null],
    ["Wer gewinnt die nächste Runde Kicker?","PERSON","members"],
    ["Wie spät wird's heute? (Uhrzeit letzter geht ins Bett, 24h)","NUMBER",null],
    ["Ruft {b} heute seine Freundin an?","YES_NO",null],
    ["Was trinken wir als Nächstes?","MULTIPLE_CHOICE",["Bier","Schnaps","Wasser","Wein"]]
  ];
  function botCreateSessionChallenge(s, quiet){
    const bots = s.members.filter(m=>m.isBot);
    if(!bots.length) return;
    const creator = pickR(bots);
    const other = pickR(bots);
    const [tpl, type, optSpec] = pickR(SESSION_CH_IDEAS);
    const q = tpl.replace("{b}", other.name);
    let options = [];
    if(type==="YES_NO") options = yesnoOpts();
    else if(type==="PERSON") options = s.members.map(m=>mkOpt(m.name));
    else if(type==="MULTIPLE_CHOICE" && Array.isArray(optSpec)) options = optSpec.map(mkOpt);
    const now = Date.now();
    const ch = { id:uid(), code:shortcode(), question:q, type, options, category:"Session",
      visibility:"SESSION", createdBy:creator.name, creatorId:creator.id, sessionId:s.id,
      status:"OPEN", createdAt:now, durationMs: rint(20,90)*60e3, locksAt: now + rint(20,90)*60e3,
      wagerCp:0, outcome:null, resolvedAt:null, payoutState:"none",
      num: type==="NUMBER" ? {min:0,max:24,center:12,dec:false} : null,
      participants:[], disputes:[], disputeStatus:null };
    creator.created = (creator.created||0)+1;
    seedSessionBots(ch, s);
    s.challenges.unshift(ch);
    if(!quiet) save();
  }
  function maybeSessionBotChallenge(s){
    if(s.status==="active" && Math.random() < 0.45) botCreateSessionChallenge(s, false);
  }
  function seedSessionBots(ch, s){
    const bots = s.members.filter(m=>m.isBot && m.id!==ch.creatorId);
    bots.sort(()=>Math.random()-0.5).slice(0, rint(1, bots.length)).forEach(b=>{
      ch.participants.push({ id:b.id, name:b.name, avatar:b.avatar, isBot:true,
        answer: botAnswerFor(ch), wagerCp:0, correct:null, rank:null, payoutCp:0 });
      b.tips = (b.tips||0)+1;
    });
  }
  function resolveSessionChallenge(ch, override){
    if(ch.status==="RESOLVED" || ch.status==="VOID") return;
    const outcome = chooseOutcome(ch, override);
    ch.outcome = outcome; ch.resolvedAt = Date.now();
    rankParticipants(ch, outcome);
    const s = sessionById(ch.sessionId);
    const tippers = ch.participants.length;
    const winners = ch.participants.filter(p=>p.correct);

    if(ch.type === "NUMBER"){
      // gestaffelt: 1./2./3.-nächste teilen sich den Punkte-Topf
      const payouts = gradedNumberPayouts(ch.participants, SESSION_BASE);
      const top = ch.participants.filter(p=>p.rank===1)[0];
      ch.factor = top ? Math.round((payouts[top.id]/SESSION_BASE)*100)/100 : 0;
      ch.participants.forEach(p=>{
        p.payoutCp = payouts[p.id] || 0;
        if(p.payoutCp>0 && s){ const m = s.members.find(x=>x.id===p.id); if(m){ m.points=(m.points||0)+p.payoutCp; if(p.correct) m.correct=(m.correct||0)+1; } }
      });
    } else if(winners.length){
      const factor = Math.min(CONFIG.payout.capMult, Math.max(CONFIG.payout.floorMult, tippers / winners.length));
      const pts = Math.round(SESSION_BASE * factor);
      ch.factor = Math.round(factor*100)/100;
      ch.participants.forEach(p=>{
        p.payoutCp = p.correct ? pts : 0;
        if(p.correct && s){ const m = s.members.find(x=>x.id===p.id); if(m){ m.points=(m.points||0)+pts; m.correct=(m.correct||0)+1; } }
      });
    } else {
      ch.factor = 0;
      ch.participants.forEach(p=>{ p.payoutCp = 0; });
    }
    ch.status = "RESOLVED";
    const you = ch.participants.find(p=>p.id==="you");
    ui.result = { chId:ch.id, session:true, sessionId:ch.sessionId, outcome, factor:ch.factor,
      isNumber: ch.type==="NUMBER", youRank: you?you.rank:null,
      youPlayed:!!you, youCorrect: you?you.correct:null, points: you?you.payoutCp:0,
      winners: ch.participants.filter(p=>p.payoutCp>0).length, tippers };
    if(s) maybeSessionBotChallenge(s);
    save();
  }
  function finalizeSession(s){
    if(s.status!=="active") return;
    s.status = "ended"; s.endedAt = Date.now();
    const r = sessionRanking(s);
    s.winnerId = r.length ? r[0].id : null;
    save();
  }
  function endSessionNow(s){
    finalizeSession(s);
    ui.modal = { kind:"sessionEnd", sessionId:s.id };
    render();
    if(s.winnerId==="you") confetti();
  }

    try{ localStorage.removeItem(STATE_KEY); }catch(e){}

  /* =========================================================

  ========================================================= */
  function levelFor(validCount){ return Math.floor(Math.sqrt(validCount)) + 1; }
  function levelInfo(){
    const v = state.stats.validCount, lvl = levelFor(v);
    const base = (lvl-1)*(lvl-1), next = lvl*lvl;
    return { lvl, into: v-base, span: next-base, pct: Math.round((v-base)/(next-base)*100) };
  }
  function badges(){
    const s = state.stats;
    return [
      { ic:"🎯", nm:"Erster Tipp", got: s.validCount>=1 },
      { ic:"🔥", nm:"Heißer Lauf", sub:"3 Tage", got: s.currentStreak>=3 },
      { ic:"✅", nm:"Scharfschütze", sub:"10 richtig", got: s.correctCount>=10 },
      { ic:"👑", nm:"Trefferquote", sub:"≥70% bei 10+", got: s.validCount>=10 && s.predictionScore>=70 },
      { ic:"✍️", nm:"Eigene Challenge", got: (s.createdCount||0)>=1 },
      { ic:"💰", nm:"CP-Jäger", sub:"1.000 gewonnen", got: s.totalCpWon>=1000 }
    ];
  }

  const typeLabel = t => ({YES_NO:"Ja / Nein", MULTIPLE_CHOICE:"Auswahl", NUMBER:"Zahl", PERSON:"Person", ORDER:"Was zuerst"}[t]||t);
  const visLabel = v => ({PUBLIC:"Öffentlich", FRIENDS:"Freunde"}[v]||"Öffentlich");
  function countdownText(ch){
    if(ch.disputeStatus==="open"||ch.disputeStatus==="escalated") return "In Prüfung";
    if(ch.status==="RESOLVED") return "Aufgelöst";
    if(ch.status==="VOID") return "Ungültig";
    const ms = ch.locksAt - Date.now();
    if(ms <= 0) return "Gesperrt";
    if(ms < MS_HR){ const s = Math.floor(ms/1000); return "noch "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
    if(ms < MS_DAY) return "noch "+Math.round(ms/MS_HR)+" Std";
    if(ms < 7*MS_DAY){ const d = Math.round(ms/MS_DAY); return "noch "+d+(d===1?" Tag":" Tagen"); }
    if(ms < 60*MS_DAY){ const w = Math.round(ms/(7*MS_DAY)); return "noch "+w+(w===1?" Woche":" Wochen"); }
    const mo = Math.round(ms/(30*MS_DAY)); return "noch "+mo+(mo===1?" Monat":" Monaten");
  }
  const outcomeLabel = (ch,key) => ch.type==="NUMBER" ? fmtNum(parseNum(key)) : ((ch.options.find(o=>o.key===key)||{}).label || "—");

        ${resolverInput(ch)}`;
