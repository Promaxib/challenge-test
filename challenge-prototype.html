        h += `<div class="opt-grid">
          <button class="btn ghost" data-act="dispute-reject">Einspruch ablehnen – Ergebnis bleibt</button>
          <button class="btn" style="background:var(--hot);box-shadow:0 4px 0 color-mix(in srgb,var(--hot) 70%, #000)" data-act="dispute-void">Challenge für ungültig erklären</button>
        </div>`;
      }
    } else if(resolved){
      const zeroWinnerVoid = ch.status==="VOID" && ch.voidReason==="Niemand lag richtig";
      h += `<div class="locked-box">
        <span class="lbl">${ch.status==="VOID" ? (zeroWinnerVoid ? "Ungültig – niemand lag richtig" : "Ungültig – Einsätze zurück") : "Ergebnis"}</span>
        <span class="val">${ch.status==="VOID" ? (zeroWinnerVoid ? "Wäre richtig gewesen: "+esc(outcomeLabel(ch, ch.outcome)) : "Einsätze zurück") : esc(outcomeLabel(ch, ch.outcome))}</span>
        ${you && ch.status!=="VOID" ? `<span class="lbl" style="margin-top:6px">Dein Tipp: <b>${esc(outcomeLabel(ch, you.answer))}</b> · ${you.payoutCp>0?`<b style="color:var(--win)">+${fmt(you.payoutCp)} ${inSession?"Punkte":"CP"}</b>`:(inSession?"kein Treffer":"verloren")}</span>`:``}
        ${ch.disputeStatus==="rejected"?`<span class="lbl" style="margin-top:6px">⚖ Einspruch geprüft – bleibt bestehen</span>`:``}
        ${ch.disputeStatus==="void"?`<span class="lbl" style="margin-top:6px">⚖ Nach Einspruch für ungültig erklärt</span>`:``}
        ${ch.disputeStatus==="resolved_after_dispute"?`<span class="lbl" style="margin-top:6px">⚖ Nach Einspruch neu aufgelöst</span>`:``}
      </div>`;
      h += `<button class="btn" data-act="see-result">Auswertung ansehen</button>`;
      const canDispute = !inSession && you && !ch.disputeStatus && (ch.status==="RESOLVED" || zeroWinnerVoid);
      if(canDispute){
        h += `<button class="btn subtle" style="width:100%;margin-top:10px" data-act="to-dispute">⚖️ Ergebnis anfechten</button>
        <p class="hint" style="text-align:center;margin-top:6px">${ch.status==="VOID" ? "Du lagst richtig und das Ergebnis stimmt nicht? Dann anfechten." : "Möglich bis kurz nach der Auflösung ("+CONFIG.disputeHoldMinutes+" Min Haltefenster)."}</p>`;
      }
    } else if(ch.mine && !inSession && !you){
      h += `<div class="locked-box">
        <span class="lbl">Deine Challenge</span>
        <span class="val">Du tippst hier nicht mit</span>
        <span class="lbl" style="margin-top:6px">Fairness: Ersteller:innen setzen nicht auf die eigene Challenge. Fürs Erstellen gab es <b>+${fmt(CONFIG.create.rewardCp)} CP</b>${ch.qualityBonusGiven ? "" : `, <b>+${fmt(CONFIG.create.qualityBonusCp)} CP</b> extra bei mindestens ${CONFIG.create.qualityMinParticipants} Mitspieler:innen`}.</span>
      </div>
      <p class="hint" style="text-align:center;margin-top:4px">${ch.participants.length ? "Trage unten das richtige Ergebnis ein, sobald das Ereignis vorbei ist." : "Noch keine Tipps. Teile den Link, damit Leute mitmachen."}</p>`;
    } else if(you){
      h += `<div class="locked-box">
        <span class="lbl">Dein Tipp steht</span>
        <span class="val">${esc(outcomeLabel(ch, you.answer))}</span>
        <span class="lbl" style="margin-top:4px">${inSession?"nicht mehr änderbar":"−"+fmt(you.wagerCp)+" CP · nicht mehr änderbar"}</span>
      </div>
      ${ch.mine ? `` : `<button class="btn" data-act="simulate">Ergebnis ${inSession?"eintragen":"simulieren"} →</button>
      <p class="hint" style="text-align:center;margin-top:8px">${inSession?"Jede:r in der Session kann auflösen.":"Im echten Produkt passiert das automatisch, wenn das Ereignis vorbei ist."}</p>`}`;
    } else if(locked){
      h += `<p class="empty">Keine neuen Tipps mehr möglich.</p>`;
      if(parts>0 && !ch.mine) h += `<button class="btn" data-act="simulate">Ergebnis ${inSession?"eintragen":"simulieren"} →</button>`;
    } else {
      h += `<h3 style="font-size:14px;color:var(--ink-soft);margin-bottom:10px">DEIN TIPP</h3>`;
      h += predictionInput(ch);
      if(!inSession){
        h += `<div class="stake-row"><span>Einsatz</span><span class="mono">${fmt(ch.wagerCp)} CP</span></div>`;
        if(ui.pick!=null && ch.type!=="NUMBER"){
          const pw = projectedWin(ch, ui.pick);
          h += `<p class="hint" style="text-align:center;margin:-4px 0 12px">Gewinn bei Treffer: ~<b style="color:var(--gold-deep)">${fmt(pw.cp)} CP</b> <span style="opacity:.7">(×${pw.factor.toLocaleString("de-DE")})</span></p>`;
        }
      } else {
        h += `<p class="hint" style="text-align:center;margin:6px 0 12px">Kein Einsatz. Richtiger Tipp = Punkte (mehr, je weniger andere richtig lagen).</p>`;
      }
      const brokeMain = !inSession && state.wallet.balanceCp < ch.wagerCp;
      if(brokeMain){
        const left = adBonusesLeft();
        h += left>0
          ? `<div class="ad-prompt" style="margin-bottom:12px"><span>🪙</span><div><strong>Nicht genug CP.</strong> Werbung ansehen für <b>+${CONFIG.adBonus.cp} CP</b> – heute noch ${left}×.</div><button class="btn sm" data-act="watch-ad" style="background:var(--gold);color:#3a2600;box-shadow:0 3px 0 var(--gold-deep)">📺 Ansehen</button></div>`
          : `<p class="hint" style="text-align:center;margin:6px 0 12px;color:var(--hot)">Nicht genug CP – und heute keine Werbe-Boni mehr. Morgen gibt's wieder ${CONFIG.adBonus.maxPerDay}× + ${fmt(CONFIG.dailyGrantCp)} CP.</p>`;
      }
      h += `<button class="btn" data-act="submit" ${(ui.pick==null || brokeMain)?"disabled":""}>Tipp abgeben</button>`;
    }

    if(ch.mine && !resolved && !inDispute){
      h += inSession
        ? sessionResolvePanel(ch)
        : `<div style="margin-top:24px"><h3 style="font-size:14px;color:var(--ink-soft);margin-bottom:10px">ALS ERSTELLER:IN AUFLÖSEN</h3>${resolverInput(ch)}</div>`;
    }
    if(!inSession) h += `<p class="hint" style="text-align:center;margin-top:22px">Teilen: challenge.app/c/${ch.code}</p>`;
    return h + `</div>`;
  }

  function predictionInput(ch){
    if(ch.type==="YES_NO"){
      return `<div class="yesno">
        <button class="opt" data-pick="yes" aria-pressed="${ui.pick==='yes'}"><span>Ja</span></button>
        <button class="opt" data-pick="no" aria-pressed="${ui.pick==='no'}"><span>Nein</span></button>
      </div>`;
    }
    if(ch.type==="NUMBER"){
      const v = ui.pick==null ? "" : ui.pick;
      const dec = numDec(ch);
      const steppers = dec
        ? `<button data-step="-1">−1</button><button data-step="-0.1">−0,10</button><button data-step="0.1">+0,10</button><button data-step="1">+1</button>`
        : `<button data-step="-5">−5</button><button data-step="-1">−1</button><button data-step="1">+1</button><button data-step="5">+5</button>`;
      return `<div class="num-wrap">
        <input class="num-input mono" type="text" inputmode="${dec?'decimal':'numeric'}" placeholder="${dec?'z. B. 4,20':'z. B. 3'}" value="${esc(v)}" data-num aria-label="Deine Zahl">
        <div class="num-steppers">${steppers}</div>
        <p class="hint" style="text-align:center">${dec?'Kommawerte erlaubt (z. B. 4,20).':'Nur ganze Zahlen.'} Je näher dran, desto mehr Punkte – die drei Nächsten teilen sich den Topf (ca. 60 / 30 / 10 %).</p>
      </div>`;
    }
    return `<div class="opt-grid">` + ch.options.map(o=>`
      <button class="opt" data-pick="${o.key}" aria-pressed="${ui.pick===o.key}">
        <span>${esc(o.label)}</span><span class="dot"></span>
      </button>`).join("") + `</div>`;
  }
  function resolverInput(ch){
    if(ch.type==="NUMBER"){
      const dec = numDec(ch);
      return `<div class="num-wrap">
        <input class="num-input mono" type="text" inputmode="${dec?'decimal':'numeric'}" placeholder="${dec?'z. B. 4,20':'z. B. 3'}" data-resolve-num aria-label="Ergebnis">
        <button class="btn ghost" data-act="resolve-mine">Challenge auflösen</button>
      </div>`;
    }
    return `<div class="opt-grid">` + ch.options.map(o=>`
      <button class="opt" data-resolve="${o.key}"><span>${esc(o.label)}</span><span class="dot"></span></button>`).join("") + `</div>`;
  }
  // Partymodus: Ersteller:in trägt das Ergebnis ein → Challenge endet sofort für alle (auch vorzeitig).
  function sessionResolvePanel(ch){
    const isNum = ch.type === "NUMBER", pick = ui.resolvePick;
    let picker;
    if(isNum){
      const dec = numDec(ch);
      picker = `<input class="num-input mono" type="text" inputmode="${dec?'decimal':'numeric'}" placeholder="${dec?'z. B. 4,20':'z. B. 3'}" data-resolve-num aria-label="Ergebnis" style="font-size:26px;padding:14px">`;
    } else {
      picker = `<div class="opt-grid">` + ch.options.map(o=>`
        <button class="opt" data-rpick="${o.key}" aria-pressed="${pick===o.key}"><span>${esc(o.label)}</span><span class="dot"></span></button>`).join("") + `</div>`;
    }
    const ready = isNum || pick != null;
    return `<div class="dur-box" style="margin-top:24px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line-strong))">
      <h3 style="font-size:15px;margin-bottom:4px">Auflösen & beenden</h3>
      <p class="hint" style="margin-bottom:12px">Du hast diese Challenge erstellt. Trägst du das Ergebnis ein, <b>endet sie sofort für alle</b> – auch vor Ablauf der Zeit.</p>
      ${picker}
      <button class="btn" style="margin-top:12px" data-act="session-resolve-go" ${ready?'':'disabled'}>Ergebnis eintragen &amp; beenden</button>
    </div>`;
  }

  function viewDispute(){
    const ch = findChallengeAnywhere(ui.chId);
    if(!ch) return viewHome();
    return `<div class="view-enter">
      <button class="back-btn" data-act="back-challenge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg> Zurück</button>
      <h1 style="font-size:22px;margin:14px 2px 4px">Ergebnis anfechten</h1>
      <p class="hint" style="margin:0 2px 16px">„${esc(ch.question)}" · ${ch.status==="VOID" ? "Ungültig – eingetragenes Ergebnis" : "Ergebnis"}: <b>${esc(outcomeLabel(ch, ch.outcome))}</b></p>
      <div class="field"><label>Warum fechtest du an?</label>
        <div class="radio-list" data-dispute-reasons>
          ${DISPUTE_REASONS.map(([k,l])=>`<button data-dreason="${k}" aria-pressed="${ui.disputeReason===k}"><span class="rd"></span><span>${l}</span></button>`).join("")}

      <div class="field"><label>Was ist passiert? <span class="opt-lbl">(optional)</span></label>

      </div>
      <button class="btn" style="background:var(--hot);box-shadow:0 4px 0 color-mix(in srgb,var(--hot) 70%, #000)" data-act="submit-dispute" ${ui.disputeReason?"":"disabled"}>Einspruch absenden</button>
      <p class="hint" style="text-align:center;margin-top:10px">Die Auszahlung wird eingefroren, bis der Streitfall geklärt ist. Ungültige Challenges zählen nicht als falscher Tipp.</p>
    </div>`;
  }

  /* ---------- Result popup ---------- */
  function resultSummaryFor(ch){
    const you = ch.participants.find(p=>p.id==="you");
    const paidCount = ch.participants.filter(p=>p.payoutCp>0).length;
    if(ch.sessionId){
      return { chId:ch.id, session:true, sessionId:ch.sessionId, outcome:ch.outcome,
        factor: ch.factor || 0, isNumber: ch.type==="NUMBER", youRank: you?you.rank:null,
        youPlayed:!!you, youCorrect: you?you.correct:false,
        points: you?you.payoutCp:0, winners: paidCount, tippers: ch.participants.length };
    }
    return {
      chId:ch.id, voided: ch.status==="VOID", reason: ch.voidReason || "Ungültig",
      outcome: ch.outcome,
      youPlayed: !!you, youAnswer: you?you.answer:null, youCorrect: you?you.correct:null,
      youRank: you?you.rank:null, isNumber: ch.type==="NUMBER",
      payout: you ? you.payoutCp : 0,
      factor: ch.factor != null ? ch.factor : Math.round(rarityFactor(ch.participants.length, ch.participants.filter(p=>p.correct).length) * 100) / 100,
      creatorBonus: (ch.mine && ch.qualityBonusGiven) ? CONFIG.create.qualityBonusCp : 0,
      winners: paidCount
    };
  }
  function openResultModal(chId){
    ui.chId = chId;
    ui.modal = { kind:"result", chId };
    render();
    burstIfWin();
  }
  function animateModalPayout(){
    const n = document.querySelector(".mh-pay[data-count]");
    if(!n) return;
    const target = Number(n.getAttribute("data-count")) || 0;
    if(target <= 0 || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    const t0 = performance.now(), dur = 650;
    (function s(t){ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      n.textContent = "+"+fmt(Math.round(target*e)); if(k<1) requestAnimationFrame(s); })(t0);
  }
  let MODAL_SHOWN_FOR = null;
  function renderModalRoot(){
    const root = document.getElementById("modalRoot");
    if(!root) return;
    if(!ui.modal || !state || !state.user){ root.innerHTML = ""; MODAL_SHOWN_FOR = null; return; }
    if(ui.modal.kind === "result"){
      const ch = findChallengeAnywhere(ui.modal.chId);
      if(!ch || ch.status==="OPEN" || ch.status==="LOCKED"){ root.innerHTML=""; MODAL_SHOWN_FOR=null; ui.modal=null; return; }
      if(MODAL_SHOWN_FOR === ch.id && root.firstElementChild) return; // already open — don't replay animations
      const r = (ui.result && ui.result.chId===ch.id) ? ui.result : resultSummaryFor(ch);
      root.innerHTML = `<div class="modal-wrap"><div class="modal-dim" data-act="close-modal"></div>${resultModalHTML(ch, r)}</div>`;
      MODAL_SHOWN_FOR = ch.id;
      animateModalPayout();
    } else if(ui.modal.kind === "sessionEnd"){
      const s = sessionById(ui.modal.sessionId);
      if(!s){ root.innerHTML=""; MODAL_SHOWN_FOR=null; ui.modal=null; return; }
      if(MODAL_SHOWN_FOR === "end_"+s.id && root.firstElementChild) return;
      root.innerHTML = `<div class="modal-wrap"><div class="modal-dim" data-act="close-modal"></div>${sessionEndModalHTML(s)}</div>`;
      MODAL_SHOWN_FOR = "end_"+s.id;
      animateModalPayout();
    } else if(ui.modal.kind === "ad"){
      const key = "ad_" + (ui.modal.ready ? "1" : "0");
      if(MODAL_SHOWN_FOR === key && root.firstElementChild) return;
      root.innerHTML = `<div class="modal-wrap"><div class="modal-dim" data-act="close-modal"></div>${adModalHTML()}</div>`;
      MODAL_SHOWN_FOR = key;
    } else if(ui.modal.kind === "placePicker"){
      if(MODAL_SHOWN_FOR === "place" && root.firstElementChild) return;
      root.innerHTML = `<div class="modal-wrap"><div class="modal-dim" data-act="close-modal"></div>${placePickerModalHTML()}</div>`;
      MODAL_SHOWN_FOR = "place";
    }
  }
  function placePickerModalHTML(){
    const gps = ui.modal.gps;
    const list = ui._gps
      ? [...PLACES].sort((a,b)=> distKm(ui._gps,a) - distKm(ui._gps,b))
      : PLACES;
    return `<div class="modal-card" style="max-width:392px">
      <div class="modal-hero" style="padding:20px 18px 12px">
        <button class="modal-x" data-act="close-modal" aria-label="Schließen">✕</button>
        <div class="mh-headline" style="font-size:21px">📍 Wo bist du gerade?</div>
        <span class="mh-outcome">${gps ? "GPS aktiv – wähl den passenden Ort" : "Kein GPS – wähl deinen Ort"}</span>
      </div>
      <div class="modal-scroll">
        <div class="podium">
          ${list.map(p=>{ const d = ui._gps ? distKm(ui._gps,p) : null;
            return `<button type="button" class="p-row" data-pickplace="${p.id}" style="width:100%;text-align:left;cursor:pointer">
              <span class="p-av">${p.icon}</span>
              <span class="p-main"><span class="p-name" style="display:block">${esc(p.name)}</span><span class="p-pick" style="display:block">${p.kind}${d!=null?" · "+kmLabel(d)+" laut GPS":""}</span></span>
              <span class="p-pay none">›</span>
            </button>`; }).join("")}
        </div>
        <p class="hint" style="text-align:center;margin-top:8px">Im echten Produkt erkennt die App den Ort automatisch aus deinen Koordinaten. Für die Demo zählt der gewählte Ort.</p>
      </div>
      <div class="modal-foot"><button class="btn subtle" style="flex:1" data-act="close-modal">Abbrechen</button></div>
    </div>`;
  }
  function adModalHTML(){
    const ready = ui.modal.ready;
    return `<div class="modal-card" style="max-width:352px">
      <div class="ad-screen">
        <div class="ad-tag">Werbung · simuliert</div>
        <div class="ad-fake">
          <div class="ad-logo">🍔</div>
          <div class="ad-l1">SUPER BURGER</div>
          <div class="ad-l2">2 für 1 – nur heute!</div>
        </div>
        <div class="ad-bar"><span class="${ready?'done':'run'}"></span></div>
        <p class="hint" style="text-align:center;margin-top:4px">${ready ? "Danke fürs Ansehen 👍" : "Bitte kurz ansehen …"}</p>
      </div>
      <div class="modal-foot">
        <button class="btn subtle" data-act="close-modal">Abbrechen</button>
        ${ready
          ? `<button class="btn gold" style="flex:1" data-act="claim-ad">+${CONFIG.adBonus.cp} CP abholen</button>`
          : `<button class="btn ghost" style="flex:1" disabled>+${CONFIG.adBonus.cp} CP gleich …</button>`}
      </div>
    </div>`;
  }
  function sessionResultModalHTML(ch, r){
    const s = sessionById(ch.sessionId);
    const isNum = ch.type==="NUMBER";
    const won = r.youPlayed && r.points > 0;
    const headline = !r.youPlayed ? "AUFGELÖST" : won ? (r.youCorrect ? "RICHTIG!" : "NAH DRAN!") : "DANEBEN";
    const parts = [...ch.participants].sort((a,b)=>(b.payoutCp-a.payoutCp)||((a.rank||9)-(b.rank||9))||String(a.name).localeCompare(String(b.name)));
    const winnersN = parts.filter(p=>p.payoutCp>0).length;
    let hero = `<div class="modal-hero ${won?'win':''}">
      <button class="modal-x" data-act="close-modal" aria-label="Schließen">✕</button>
      <div class="mh-headline ${won?'win':''}">${headline}</div>
      <span class="mh-outcome">Ergebnis: ${esc(outcomeLabel(ch, ch.outcome))}</span>
      <div class="mh-pay ${won?'win':''}" ${won?`data-count="${r.points}"`:""}>${won ? "+"+fmt(r.points) : "±0"}</div>
      ${r.youPlayed ? `<div class="mh-badges"><span class="mh-xp">${won?(isNum?`Punkte · Platz ${r.youRank||"?"}`:`Punkte · Faktor ×${(r.factor||1).toLocaleString("de-DE")}`):"kein Treffer"}</span></div>` : ""}
    </div>`;
    let body = `<div class="modal-scroll">
      <div class="pool-strip">
        <div class="ps"><div class="v">${parts.length}</div><div class="k">Tipps</div></div>
        <div class="ps"><div class="v">${winnersN}/${parts.length}</div><div class="k">${isNum?"im Geld":"richtig"}</div></div>
        <div class="ps"><div class="v mono">${r.factor?"×"+r.factor.toLocaleString("de-DE"):"—"}</div><div class="k">${isNum?"Nächste:r":"Faktor"}</div></div>
      </div>
      <div class="podium-h">${isNum?"Nach Nähe geordnet":"Alle Tipps"}</div><ul class="podium">`;
    body += parts.map((p,i)=>{
      const w = p.payoutCp > 0;
      let pick;
      if(isNum){
        const d = Math.abs(parseNum(p.answer) - parseNum(ch.outcome));
        pick = fmtNum(parseNum(p.answer)) + (d===0 ? " · genau" : " · " + fmtNum(d) + " daneben");
      } else pick = outcomeLabel(ch,p.answer) + (p.correct?" ✓":" ✗");
      return `<li class="p-row ${w?'won':''} ${p.id==='you'?'me':''}"><span class="p-pos">${w&&i<3?["🥇","🥈","🥉"][i]:(i+1)}</span><span class="p-av">${p.avatar}</span><span class="p-main"><div class="p-name">${esc(p.name)}${p.id==='you'?' · du':''}</div><div class="p-pick">${esc(pick)}</div></span><span class="p-pay ${w?'':'none'}">${w?"+"+fmt(p.payoutCp):"—"}</span></li>`;
    }).join("");
    body += `</ul>`;
    if(s){
      const rank = sessionRanking(s);
      body += `<div class="podium-h" style="margin-top:14px">Session-Ranking</div><ul class="podium">`;
      body += rank.slice(0,6).map((m,i)=>`<li class="p-row ${m.id==='you'?'me':''}"><span class="p-pos">${["🥇","🥈","🥉"][i]||(i+1)}</span><span class="p-av">${m.avatar}</span><span class="p-main"><div class="p-name">${esc(m.name)}${m.id==='you'?' · du':''}</div></span><span class="p-pay" style="color:var(--ink)">${fmt(m.points||0)}</span></li>`).join("");
      body += `</ul>`;
    }
    body += `</div>`;
    const foot = `<div class="modal-foot"><button class="btn" style="flex:1" data-act="close-modal">Weiter</button></div>`;
    return `<div class="modal-card">${hero}${body}${foot}</div>`;
  }
  function sessionEndModalHTML(s){
    const rank = sessionRanking(s);
    const w = rank[0];
    const youWon = w && w.id==="you";
    let hero = `<div class="modal-hero ${youWon?'win':''}">
      <button class="modal-x" data-act="close-modal" aria-label="Schließen">✕</button>
      <div class="mh-headline win">🏆 ${esc(s.name)}</div>
      <span class="mh-outcome">Session beendet</span>
      <div class="mh-pay win">${w?esc(w.name):"—"}</div>
      <div class="mh-badges"><span class="mh-xp">${w?fmt(w.points||0)+" Punkte":""}</span></div>
    </div>`;
    let body = `<div class="modal-scroll"><div class="podium-h">Endstand</div><ul class="podium">`;

  function resultModalHTML(ch, r){
    if(r.session || ch.sessionId) return sessionResultModalHTML(ch, r);
    const isVoid = ch.status === "VOID";
    const disputeVoid = ch.disputeStatus === "void";
    const hasOutcome = ch.outcome != null && !disputeVoid; // determinate result to show
    const you = ch.participants.find(p=>p.id==="you");
    const youWon = r.youPlayed && r.payout > 0 && !isVoid;
    const fresh = ui.result && ui.result.chId===ch.id && ui.result.scoreBefore!==undefined;
    const headline = isVoid ? "UNGÜLTIG"
      : !r.youPlayed ? "AUFGELÖST"
      : youWon ? (r.youCorrect ? "GEWONNEN!" : "AUFS PODIUM!")
      : "DANEBEN";
    const leveledUp = fresh && levelFor(ui.result.validBefore) < levelInfo().lvl;

    let hero = `<div class="modal-hero ${youWon?'win':''} ${isVoid?'void':''}">
      <button class="modal-x" data-act="close-modal" aria-label="Schließen">✕</button>
      <div class="mh-headline ${youWon?'win':''}">${headline}</div>
      <span class="mh-outcome">${isVoid
        ? (hasOutcome ? "Wäre richtig gewesen: " + esc(outcomeLabel(ch, ch.outcome)) : "Einsätze zurück")
        : "Ergebnis: " + esc(outcomeLabel(ch, ch.outcome))}</span>`;
    if(!isVoid){
      hero += `<div class="mh-pay ${youWon?'win':''}" ${youWon?`data-count="${r.payout}"`:""}>${youWon ? "+"+fmt(r.payout) : (r.youPlayed ? "−"+fmt(ch.wagerCp) : "±0")}</div>`;
      if(r.youPlayed){
        hero += `<div class="mh-badges"><span class="mh-xp">+1 Tipp gewertet</span>`
          + (youWon && r.factor ? `<span class="mh-xp lvl">Faktor ×${r.factor.toLocaleString("de-DE")}</span>` : ``)
          + (leveledUp ? `<span class="mh-xp lvl">🎉 Level ${levelInfo().lvl}</span>` : ``)
          + `</div>`;
      }
    } else {
      hero += `<div class="mh-pay">±0</div>`;
    }
    hero += `</div>`;

    const parts = [...ch.participants].sort((a,b)=>
      (b.payoutCp - a.payoutCp) || ((a.rank||9) - (b.rank||9)) || String(a.name).localeCompare(String(b.name)));
    const medal = ["🥇","🥈","🥉"];
    const winnersN = parts.filter(p=>p.correct).length;

    let body = `<div class="modal-scroll">`;
    if(isVoid){
      body += `<p class="hint" style="text-align:center;padding:6px 4px 12px">${esc(r.reason)}. `
        + (r.youPlayed ? `Dein Einsatz (${fmt(ch.wagerCp)} CP) ist zurück. ` : ``)
        + `Zählt nicht als falscher Tipp.</p>`;
      body += `<div class="pool-strip">
        <div class="ps"><div class="v">${parts.length}</div><div class="k">Teilnehmer</div></div>
        <div class="ps"><div class="v">${hasOutcome ? esc(outcomeLabel(ch, ch.outcome)) : "—"}</div><div class="k">${hasOutcome ? "wäre richtig" : "kein Ergebnis"}</div></div>
        <div class="ps"><div class="v mono">±0</div><div class="k">Einsatz zurück</div></div>
      </div>`;
    } else {
      const isNum = ch.type === "NUMBER";
      body += `<div class="pool-strip">
        <div class="ps"><div class="v">${parts.length}</div><div class="k">Teilnehmer</div></div>
        <div class="ps"><div class="v">${winnersN}/${parts.length}</div><div class="k">${isNum?"im Geld":"richtig"}</div></div>
        <div class="ps"><div class="v mono">${r.factor ? "×"+r.factor.toLocaleString("de-DE") : "—"}</div><div class="k">${isNum?"Nächste:r":"Faktor"}</div></div>
      </div>`;
    }

    body += `<div class="podium-h">${ch.type==="NUMBER" && !isVoid ? "Nach Nähe geordnet" : "Teilnehmende ("+parts.length+")"}</div><ul class="podium">`;
    body += parts.map((p,i)=>{
      const won = !isVoid && p.payoutCp > 0;
      let pick;
      if(ch.type === "NUMBER"){
        const d = hasOutcome ? Math.abs(parseNum(p.answer) - parseNum(ch.outcome)) : null;
        pick = fmtNum(parseNum(p.answer)) + (d==null ? "" : d===0 ? " · genau richtig" : " · " + fmtNum(d) + " daneben");
      } else {
        const mark = hasOutcome ? (p.answer === ch.outcome ? " ✓" : " ✗") : "";
        pick = outcomeLabel(ch, p.answer) + mark;
      }
      return `<li class="p-row ${won?'won':''} ${p.id==='you'?'me':''}" style="animation-delay:${Math.min(i,8)*28}ms">
        <span class="p-pos">${won && i<3 ? medal[i] : (i+1)}</span>
        <span class="p-av">${p.avatar}</span>
        <span class="p-main">
          <div class="p-name">${esc(p.name)}${p.id==='you'?' · du':''}</div>
          <div class="p-pick">${esc(pick)}</div>

        <span class="p-pay ${won?'':'none'}">${won ? "+"+fmt(p.payoutCp) : (isVoid ? "±0" : "—")}</span>
      </li>`;
    }).join("");
    body += `</ul>`;
    if(!isVoid) body += `<p class="hint" style="text-align:center;margin-top:9px">${ch.type==="NUMBER"
      ? "Die drei Nächsten teilen sich den Topf (Einsatz × Teilnehmer) – ca. 60 / 30 / 10 %."
      : "Belohnung = Einsatz ÷ Anteil richtiger Tipps ("+CONFIG.payout.floorMult.toLocaleString("de-DE")+"×–"+CONFIG.payout.capMult+"×)."}</p>`;
    if(r.creatorBonus) body += `<p class="hint" style="text-align:center;margin-top:9px;color:var(--gold-deep)"><b>+${fmt(r.creatorBonus)} CP Ersteller-Bonus</b> – genug Mitspieler:innen, sauber aufgelöst.</p>`;

    if(r.youPlayed && !isVoid){
      body += `<div class="prog"><div class="kv-list">`;
      if(fresh) body += `<div class="kv"><span class="k">Prediction Score</span><span class="v">${ui.result.scoreBefore}%<span class="arrow">→</span>${ui.result.scoreAfter}%${ui.result.scoreAfter>ui.result.scoreBefore?` <span class="delta-up">▲</span>`:``}</span></div>`;
      body += `<div class="kv"><span class="k">Streak</span><span class="v">🔥 ${state.stats.currentStreak} Tage</span></div>`;
      body += `<div class="kv"><span class="k">Level</span><span class="v">Lv ${levelInfo().lvl}</span></div>`;
      body += `<div class="kv"><span class="k">CP-Kontostand</span><span class="v mono">${fmt(state.wallet.balanceCp)} CP</span></div>`;
      body += `</div></div>`;
    }
    body += `</div>`;

    const canDispute = r.youPlayed && !ch.disputeStatus
      && (ch.status==="RESOLVED" || (ch.status==="VOID" && ch.voidReason==="Niemand lag richtig"));
    const foot = `<div class="modal-foot">
      ${canDispute ? `<button class="btn subtle" style="flex:1" data-act="to-dispute">⚖️ Anfechten</button>` : ``}
      <button class="btn" style="flex:1" data-act="close-modal">Weiter</button>
    </div>`;

    return `<div class="modal-card">${hero}${body}${foot}</div>`;
  }

  // Feld "Läuft bis": Umschalter Dauer-Slider / Datum & Uhrzeit + Live-Anzeige "endet …"
  function durationField(d){
    const mode = d.endMode === "datetime" ? "datetime" : "duration";
    const idx = snapDurationIndex(d.durationMs || 10*MS_MIN);
    const pct = Math.round(idx / (DURATION_STEPS.length - 1) * 100);
    const maxEnd = draftMaxEndMs(d);
    const endMs = draftEndMs(d);
    const clamped = (Date.now() + DURATION_STEPS[idx]) > maxEnd + 60e3;
    const bigTxt = mode === "datetime"
      ? (d.endAt ? fmtDur(Math.max(0, d.endAt - Date.now())) : "—")
      : (clamped ? fmtDur(Math.max(0, maxEnd - Date.now())) : fmtDur(DURATION_STEPS[idx]));
    const subTxt = (mode === "datetime" && !d.endAt) ? "Zeitpunkt wählen" : fmtEndStamp(endMs);
    const sessionCap = (d.sessionId && (()=>{ const s = sessionById(d.sessionId); return s && s.endsAt; })())
      ? `<p class="hint" style="margin-top:8px">Endet spätestens mit der Session (${fmtEndStamp(maxEnd).replace("endet ","")}).</p>` : "";
    let inner;
    if(mode === "datetime"){
      inner = `<input type="datetime-local" data-draft-endat min="${toLocalInput(Date.now()+5*MS_MIN)}" max="${toLocalInput(maxEnd)}" value="${d.endAt ? toLocalInput(d.endAt) : ""}">
        <div class="dur-scale" style="margin-top:8px"><span>frühestens in 5 Min</span><span>spätestens ${fmtEndStamp(maxEnd).replace("endet ","")}</span></div>${sessionCap}`;
    } else {
      inner = `<input type="range" class="dur-slider" min="0" max="${DURATION_STEPS.length-1}" step="1" value="${idx}" data-draft-dur style="--p:${pct}%" aria-label="Laufzeit">
        <div class="dur-scale"><span>1 Min</span><span>15 Min</span><span>2 Std</span><span>8 Std</span><span>24 Std</span></div>
        <p class="hint" style="margin-top:8px">Länger als 24 Std (z. B. Wahl, Saison)? → „Datum &amp; Uhrzeit".</p>${sessionCap}`;
    }
    return `<div class="dur-box">
      <div class="dur-modes">
        <button type="button" data-durmode="duration" aria-pressed="${mode==='duration'}">Dauer</button>
        <button type="button" data-durmode="datetime" aria-pressed="${mode==='datetime'}">Datum &amp; Uhrzeit</button>
      </div>
      <div class="dur-read"><span class="big" data-dur-big>${bigTxt}</span><span class="sub" data-dur-sub>${subTxt}</span></div>
      ${inner}
    </div>`;
  }

      <details class="how" open><summary>So funktioniert CHALLENGE</summary>
        <ol>
          <li>Jeden Tag <b>${fmt(CONFIG.dailyGrantCp)} CP</b>, wenn du aktiv bist – reicht für ~10 Tipps.</li>
          <li>Ein Tipp kostet <b>${CONFIG.wagerCp} CP</b>. Sind sie alle: <b>${CONFIG.adBonus.maxPerDay}×</b> pro Tag eine kurze Werbung ansehen → je <b>+${CONFIG.adBonus.cp} CP</b>.</li>
          <li><b>Richtig getippt</b> → Belohnung = Einsatz ÷ Anteil der richtigen Tipper (${CONFIG.payout.floorMult.toLocaleString("de-DE")}×–${CONFIG.payout.capMult}×). Je seltener dein richtiger Tipp, desto mehr.</li>
          <li><b>Falsch getippt</b> → die ${CONFIG.wagerCp} CP sind weg.</li>
          <li>Bei „Zahl" zählt als richtig, wer am nächsten am Ergebnis liegt.</li>
          <li><b>Eigene Challenge?</b> Da tippst du nicht mit (Fairness). Dafür <b>+${CONFIG.create.rewardCp} CP</b> fürs Erstellen und <b>+${CONFIG.create.qualityBonusCp} CP</b>, wenn mindestens ${CONFIG.create.qualityMinParticipants} Leute mitmachen. Erstell-Bonus: ${CONFIG.create.maxRewardedPerDay}×/Tag.</li>
          <li><b>Prediction Score</b> = richtige ÷ gültige Tipps. Ungültige zählen nicht. Für die <b>Community-Rangliste</b> zählen nur öffentliche Challenges mit genug Mitspieler:innen.</li>
          <li><b>Level</b> steigt mit gewerteten Tipps, <b>Streak</b> mit aktiven Tagen.</li>
          <li>Ergebnis unfair? <b>Anfechten</b> → Auszahlung friert ein, Streitfall wird geprüft.</li>
        </ol>
        <p>Kein Echtgeld. CP kann man nicht kaufen oder auszahlen.</p>
      </details>

      <div class="section-head"><h2>Einstellungen</h2></div>
      <div class="field"><label>📍 Standort</label>
        <div class="seg">
          <button data-act="loc-disable" aria-pressed="${!locOn()}">Aus</button>
          <button data-act="loc-enable" aria-pressed="${locOn()}">Ein</button>
        </div>
        <span class="hint">${locOn()
          ? (state.location
              ? "An · Ort: <b>"+esc(myPlace().name)+"</b>. Challenges mit Ortsbezug sind möglich."
              : "An, aber noch kein Ort gewählt – auf der Startseite im Bereich In deiner Nähe wählen.")
          : "Aus. Der Bereich In deiner Nähe ist ausgeblendet und Challenges mit Ortsbezug lassen sich nicht erstellen."}</span>
      </div>

      ${ui.confirmReset
        ? `<div style="display:flex;gap:8px">
             <button class="btn ghost" style="flex:1" data-act="reset-cancel">Abbrechen</button>
             <button class="btn" style="flex:1;background:var(--hot);box-shadow:0 4px 0 color-mix(in srgb,var(--hot) 70%, #000)" data-act="reset-do">Wirklich löschen</button>
           </div>`
        : `<button class="btn ghost" data-act="reset-ask">Alles zurücksetzen</button>`}
    </div>`;
  }

  /* ---------- Live-Gruppen-Ansichten ---------- */
  function lgSetupPanel(){
    if(lgOn()){
      const link = lgInviteLink();
      return `<div class="card" style="padding:15px;margin-bottom:14px;border-color:color-mix(in srgb,var(--win) 40%,var(--line))">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="color:var(--win)">●</span><b>Live-Modus verbunden</b></div>
        ${LG.groupId ? `<div class="field"><label>Einladungslink (an deine Leute schicken)</label>
          <input class="text-input mono" style="font-size:12px" readonly value="${esc(link)}" data-invite onclick="this.select()">
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn sm" data-act="lg-share" style="flex:1">Teilen</button>
            <button class="btn sm" data-act="lg-copy" style="flex:1">Kopieren</button>
          </div></div>` :
          `<p class="hint" style="margin-bottom:8px">Erstelle unten eine Gruppe – danach erscheint hier der Einladungslink.</p>`}
        <button class="btn subtle" style="width:100%;margin-top:6px" data-act="lg-disconnect">Live-Modus trennen</button>
      </div>`;
    }
    if(ui.sessionForm === "setup"){
      return `<div class="card" style="padding:15px;margin-bottom:14px">
        <b>Live-Modus einrichten</b>
        <p class="hint" style="margin:6px 0 12px">Aus deinem Supabase-Projekt (Settings → API). Siehe SETUP-Anleitung.</p>
        <div class="field"><label>Project URL</label>
          <input class="text-input mono" style="font-size:13px" placeholder="https://xxxx.supabase.co" data-lg-url autocomplete="off"></div>
        <div class="field"><label>anon public key</label>
          <input class="text-input mono" style="font-size:12px" placeholder="eyJhbGc..." data-lg-key autocomplete="off"></div>
        <button class="btn" data-act="lg-save-cfg">Verbinden</button>
        <button class="btn subtle" style="width:100%;margin-top:8px" data-act="session-form-cancel">Abbrechen</button>
      </div>`;
    }
    return `<button class="btn ghost" data-act="lg-setup-open" style="margin-bottom:14px">🔗 Live-Modus einrichten (Betreiber)</button>
      <p class="hint" style="margin:-6px 2px 16px">Ohne Einrichtung läuft der Partymodus als Offline-Demo mit simulierten Mitspieler:innen (nur dieses Gerät).</p>`;
  }

  function viewSessions(){
    const list = state.sessions || [];
    const f = ui.sessionForm;
    let h = `<div class="view-enter">
      <button class="back-btn" data-act="back-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg> Zurück</button>
      <h1 style="font-size:22px;margin:14px 2px 4px">👥 Zusammen spielen</h1>
      <p class="hint" style="margin:0 2px 16px">Eine Gruppe mit deinen Leuten – jede:r stellt Challenges rein, alle tippen, am Ende gewinnt, wer die meisten Punkte hat.</p>`;

    h += lgSetupPanel();

    // --- Live: aktuelle Gruppe oder Erstellen/Beitreten ---
    if(lgOn()){
      if(LG.groupId && LG.data && LG.data.group){
        const g = LG.data.group, r = lgRanking(), me = r.find(x=>x.player_id===LG.playerId);
        h += `<article class="card ch-card is-live" data-act="lg-open" role="button" tabindex="0" style="--c:var(--accent)">
          <div class="ch-head"><span class="cat-badge">👥</span><span class="ch-q">${esc(g.name)}</span></div>
          <div class="ch-tags">
            <span class="tag cat">${(LG.data.members||[]).length} dabei</span>
            <span class="tag">${(LG.data.challenges||[]).length} Challenges</span>
            ${g.status==="ended" ? `<span class="tag win">beendet</span>` : `<span class="tag live">live</span>`}
          </div>
          <div class="ch-foot">
            <div class="ch-pool"><div class="n">${fmt(me?me.points:0)} Punkte</div><div class="l">${g.status==="ended" ? "Sieger: "+esc(g.winner_name||"—") : "Code "+g.id}</div></div>
            <span class="countdown mono">${g.status==="ended" ? "beendet" : "live"}</span>
          </div>
        </article>`;
        if(LG.err) h += `<p class="hint" style="color:var(--hot);margin:6px 2px">⚠ ${esc(LG.err)}</p>`;
      } else if(f === "createLive"){
        h += `<div class="card" style="padding:15px;margin-bottom:14px">
          <div class="field"><label for="lg-name">Name der Gruppe</label>
            <input id="lg-name" class="text-input" maxlength="30" placeholder="z. B. Jungswochenende" data-lg-name autocomplete="off"></div>
          <button class="btn" data-act="lg-create-go">Gruppe erstellen</button>
          <button class="btn subtle" style="width:100%;margin-top:8px" data-act="session-form-cancel">Abbrechen</button>
        </div>`;
      } else if(f === "joinLive"){
        h += `<div class="card" style="padding:15px;margin-bottom:14px">
          <div class="field"><label for="lg-code">Gruppen-Code</label>
            <input id="lg-code" class="text-input mono" maxlength="6" placeholder="z. B. K7QF2" data-lg-code autocomplete="off" style="text-transform:uppercase"></div>
          <button class="btn" data-act="lg-join-go">Beitreten</button>
          <button class="btn subtle" style="width:100%;margin-top:8px" data-act="session-form-cancel">Abbrechen</button>
        </div>`;
      } else {
        h += `<div style="display:flex;gap:8px;margin-bottom:16px">
          <button class="btn" style="flex:1" data-act="lg-form-create">+ Neue Gruppe</button>
          <button class="btn ghost" style="flex:1" data-act="lg-form-join">Mit Code beitreten</button>
        </div>`;
      }
      h += `<button class="btn subtle" style="width:100%;margin-top:4px" data-act="toggle-demo">${ui.showDemo ? "Offline-Demo ausblenden" : "Offline-Demo anzeigen"}</button>`;
      if(!ui.showDemo) return h + `</div>`;
      h += `<div class="section-head"><h2>Offline-Demo</h2></div>
        <p class="hint" style="margin:-4px 2px 12px">Nur dieses Gerät, simulierte Mitspieler:innen.</p>`;
    }

    if(f === "create"){
      h += `<div class="card" style="padding:15px;margin-bottom:14px">
        <div class="field"><label for="s-name">Name der Session</label>
          <input id="s-name" class="text-input" maxlength="30" placeholder="z. B. Jungswochenende" data-session-name autocomplete="off"></div>
        <div class="field"><label>Ende <span class="opt-lbl">(optional)</span></label>
          <input type="datetime-local" class="text-input" data-session-end>
          <span class="hint">Ohne Angabe läuft die Session, bis du sie beendest.</span></div>
        <button class="btn" data-act="session-create-go">Session starten</button>
        <button class="btn subtle" style="width:100%;margin-top:8px" data-act="session-form-cancel">Abbrechen</button>
      </div>`;
    } else if(f === "join"){
      h += `<div class="card" style="padding:15px;margin-bottom:14px">
        <div class="field"><label for="s-code">Session-Code</label>
          <input id="s-code" class="text-input mono" maxlength="6" placeholder="z. B. K7QF2" data-session-code autocomplete="off" style="text-transform:uppercase"></div>
        <button class="btn" data-act="session-join-go">Beitreten</button>
        <button class="btn subtle" style="width:100%;margin-top:8px" data-act="session-form-cancel">Abbrechen</button>
        <p class="hint" style="margin-top:8px">Prototyp: es wird eine Beispiel-Session simuliert, der du beitrittst.</p>
      </div>`;
    } else {
      h += `<div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="btn" style="flex:1" data-act="session-form-create">+ Neue Session</button>
        <button class="btn ghost" style="flex:1" data-act="session-form-join">Mit Code beitreten</button>
      </div>`;
    }

    if(list.length){
      h += `<div class="section-head"><h2>Deine Sessions</h2></div>`;
      h += list.map(s=>{
        const me = sessionMe(s);
        const win = s.status==="ended" ? sessionRanking(s)[0] : null;
        return `<article class="card ch-card" style="--c:var(--violet)" data-session-open="${s.id}" role="button" tabindex="0">
          <div class="ch-head"><span class="cat-badge">🔒</span><span class="ch-q">${esc(s.name)}</span></div>
          <div class="ch-tags">
            <span class="tag cat">${s.members.length} dabei</span>
            <span class="tag">${s.challenges.length} Challenges</span>
            ${s.status==="ended" ? `<span class="tag win">beendet</span>` : `<span class="tag" style="color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,transparent)">läuft</span>`}
          </div>
          <div class="ch-foot">
            <div class="ch-pool"><div class="n">${fmt(me?me.points||0:0)} Punkte</div><div class="l">${s.status==="ended" && win ? "Sieger: "+esc(win.name) : "Code "+s.code}</div></div>
            <span class="countdown mono">${s.status==="ended" ? "beendet" : "aktiv"}</span>
          </div>
        </article>`;
      }).join("");
    } else if(!f){
      h += `<p class="empty">Noch keine Session. Starte eine für's nächste Wochenende!</p>`;
    }
    return h + `</div>`;
  }

  function viewSession(){
    const s = sessionById(ui.sessionId);
    if(!s) return viewSessions();
    const isHost = s.hostId === "you";
    const me = sessionMe(s);
    const rank = sessionRanking(s);
    const myPos = rank.findIndex(m=>m.id==="you") + 1;
    const open = s.challenges.filter(c=>c.status==="OPEN");
    const done = s.challenges.filter(c=>c.status!=="OPEN");

    let h = `<div class="view-enter">
      <button class="back-btn" data-act="to-sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg> Sessions</button>
      <div style="display:flex;align-items:flex-start;gap:10px;margin:14px 2px 10px">
        <div style="flex:1">
          <h1 style="font-size:21px">🔒 ${esc(s.name)}</h1>
          <p class="hint" style="margin-top:2px">${s.members.length} dabei · Code <b class="mono">${s.code}</b> · ${s.status==="ended" ? "beendet" : "läuft"}</p>
        </div>
        ${isHost && s.status==="active"
          ? (ui.confirmEndSession
              ? `<div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" data-act="end-session-go" style="background:var(--hot);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--hot) 70%,#000)">Wirklich beenden</button><button class="btn sm" data-act="end-session-cancel">Abbrechen</button></div>`
              : `<button class="btn sm" data-act="end-session-ask">Beenden</button>`)
          : ``}
      </div>`;

    if(s.status==="ended"){
      const w = rank[0];
      h += `<div class="info-banner neutral"><span>🏆</span><div><strong>Session beendet.</strong> Sieger: <b>${w?esc(w.name):"—"}</b> mit ${w?fmt(w.points||0):0} Punkten.</div></div>
        <button class="btn" data-act="show-session-end" style="margin-bottom:16px">Endstand ansehen</button>`;
    }

    // Ranking
    h += `<div class="section-head"><h2>Ranking</h2><span class="count">${myPos>0?"Du: Platz "+myPos:""}</span></div>`;
    h += `<div class="card" style="padding:4px 0;margin-bottom:16px">`;
    h += rank.slice(0,6).map((m,i)=>`<div class="rank-row ${m.id==='you'?'me':''}">
      <span class="rank-pos ${i<3?'medal':''}">${i<3?["🥇","🥈","🥉"][i]:(i+1)}</span>
      <span class="rank-av">${m.avatar}</span>
      <span class="rank-name">${esc(m.name)}${m.id==='you'?" (du)":""}<small>${m.correct||0} richtig · ${m.tips||0} Tipps</small></span>
      <span class="rank-score">${fmt(m.points||0)}</span>
    </div>`).join("");
    h += `</div>`;

    if(s.status==="active"){
      h += `<button class="btn" data-act="session-new-challenge" style="margin-bottom:16px">+ Challenge erstellen</button>`;
    }

    h += `<div class="section-head"><h2>Offen</h2><span class="count">${open.length}</span></div>`;
    h += open.length ? open.map(c=>challengeCard(c)).join("") : `<p class="empty">Keine offene Challenge – mach die erste auf!</p>`;
    if(done.length){
      h += `<div class="section-head"><h2>Erledigt</h2></div>`;
      h += done.slice(0,12).map(c=>challengeCard(c)).join("");
    }
    return h + `</div>`;
  }

  /* ---------- LIVE GROUP VIEWS ---------- */
  function lgChallengeCard(c){
    const st = lgChStatus(c);
    const tips = lgTipsFor(c.id), mine = lgMyTip(c.id);
    let tag = "";
    if(st === "resolved"){
      tag = mine ? (mine.points > 0
        ? `<span class="tag win">+${fmt(mine.points)} Pkt</span>`
        : `<span class="tag loss">kein Treffer</span>`) : `<span class="tag">aufgelöst</span>`;
    } else if(mine){
      tag = `<span class="tag" style="color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)">getippt</span>`;
    }
    return `<article class="card ch-card" data-lg-open="${c.id}" role="button" tabindex="0" style="--c:var(--accent)">
      <div class="ch-head"><span class="cat-badge">${st==="resolved"?"✅":st==="locked"?"🔒":"👥"}</span><span class="ch-q">${esc(c.question)}</span></div>
      <div class="ch-tags">
        <span class="tag">${typeLabel(c.type)}</span>
        ${tag}
      </div>
      <div class="ch-foot">
        <div class="ch-pool"><div class="n">${tips.length} ${tips.length===1?"Tipp":"Tipps"}</div><div class="l">von ${esc(c.creator_name)}</div></div>
        <span class="countdown mono ${st!=="open"?"locked":""}" data-lgcd="${c.id}">${lgCountdown(c)}</span>
      </div>
    </article>`;
  }

  function viewLiveGroup(){
    if(!lgOn() || !LG.groupId){ return viewSessions(); }
    const g = LG.data && LG.data.group;
    if(!g){
      return `<div class="view-enter"><button class="back-btn" data-act="to-sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg> Zurück</button>
        <p class="empty">${LG.err ? "⚠ " + esc(LG.err) : "Lade Gruppe …"}</p></div>`;
    }
    const host = lgIsHost(), ended = g.status === "ended";
    const r = lgRanking(), myPos = r.findIndex(x=>x.player_id===LG.playerId) + 1;
    const chs = (LG.data.challenges || []);
    const open = chs.filter(c=>lgChStatus(c) !== "resolved");
    const done = chs.filter(c=>lgChStatus(c) === "resolved");

    let h = `<div class="view-enter">
      <button class="back-btn" data-act="to-sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg> Zurück</button>
      <div style="display:flex;align-items:flex-start;gap:10px;margin:14px 2px 10px">
        <div style="flex:1">
          <h1 style="font-size:21px">👥 ${esc(g.name)}</h1>
          <p class="hint" style="margin-top:2px">${(LG.data.members||[]).length} dabei · Code <b class="mono">${g.id}</b> · <span style="color:${LG.err?'var(--hot)':'var(--win)'}">${LG.err ? "offline" : ended ? "beendet" : "live"}</span></p>
        </div>
        ${host && !ended
          ? (ui.confirmEndSession
              ? `<div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" data-act="lg-end-go" style="background:var(--hot);color:#fff">Wirklich beenden</button><button class="btn sm" data-act="end-session-cancel">Abbrechen</button></div>`
              : `<button class="btn sm" data-act="end-session-ask">Beenden</button>`)
          : ``}
      </div>`;
    if(LG.err) h += `<p class="hint" style="color:var(--hot);margin:0 2px 12px">⚠ ${esc(LG.err)} · versuche weiter …</p>`;
    if(ended){
      const w = r[0];
      h += `<div class="info-banner neutral"><span>🏆</span><div><strong>Gruppe beendet.</strong> Sieger: <b>${w?esc(w.name):"—"}</b> mit ${w?fmt(w.points):0} Punkten.</div></div>`;
    }

    h += `<div class="section-head"><h2>Ranking</h2><span class="count">${myPos>0?"Du: Platz "+myPos:""}</span></div>`;
    h += `<div class="card" style="padding:4px 0;margin-bottom:16px">`;
    h += (r.length ? r.slice(0,8) : []).map((m,i)=>`<div class="rank-row ${m.player_id===LG.playerId?'me':''}">
      <span class="rank-pos ${i<3?'medal':''}">${i<3?["🥇","🥈","🥉"][i]:(i+1)}</span>
      <span class="rank-av">${m.avatar}</span>
      <span class="rank-name">${esc(m.name)}${m.player_id===LG.playerId?" (du)":""}<small>${m.correct} richtig · ${m.tips} Tipps</small></span>
      <span class="rank-score">${fmt(m.points)}</span>
    </div>`).join("") || `<p class="empty" style="padding:16px">Noch niemand dabei.</p>`;
    h += `</div>`;

    // Host: Mitglieder verwalten
    if(host && !ended){
      if(ui.lgManageMembers){
        h += `<div class="card" style="padding:6px 0;margin:-8px 0 12px">`;
        h += (LG.data.members || []).map(m=>{
          const mt = (LG.data.tips || []).filter(t=>t.player_id === m.player_id).length;
          const removable = m.player_id !== LG.playerId && m.player_id !== g.host_id && mt === 0;
          return `<div class="rank-row">
            <span class="rank-av">${m.avatar}</span>
            <span class="rank-name" style="flex:1">${esc(m.name)}${m.player_id===LG.playerId?" (du)":""}<small>${mt} Tipps${m.player_id===g.host_id?" · Host":""}</small></span>
            ${removable
              ? (ui.lgKickPick===m.player_id
                  ? `<button class="btn sm" data-act="lg-kick-go" data-pid="${esc(m.player_id)}" style="background:var(--hot);color:#fff">Entfernen?</button>`
                  : `<button class="btn sm" data-act="lg-kick-ask" data-pid="${esc(m.player_id)}">✕</button>`)
              : `<span class="hint" style="font-size:11px">${mt>0?"hat getippt":""}</span>`}
          </div>`;
        }).join("");
        h += `</div><button class="btn subtle" style="width:100%;margin-bottom:16px" data-act="lg-manage-off">Fertig</button>`;
      } else {
        h += `<button class="btn subtle" style="width:100%;margin:-6px 0 16px" data-act="lg-manage-on">Mitglieder verwalten</button>`;
      }
    }

    if(!ended) h += `<button class="btn" data-act="lg-new-challenge" style="margin-bottom:16px">+ Challenge erstellen</button>`;

    h += `<div class="section-head"><h2>Offen</h2><span class="count">${open.length}</span></div>`;
    h += open.length ? open.map(lgChallengeCard).join("") : `<p class="empty">Keine offene Challenge – mach die erste auf!</p>`;
    if(done.length){
      h += `<div class="section-head"><h2>Erledigt</h2></div>`;
      h += done.slice(0,20).map(lgChallengeCard).join("");
    }

    // Host: Testgruppe aufräumen
    if(host){
      h += ui.lgConfirmGroupDel
        ? `<div style="margin-top:26px"><div style="display:flex;gap:8px">
             <button class="btn subtle" style="flex:1" data-act="lg-gdel-cancel">Abbrechen</button>

  /* =========================================================

  const VIEWS = { home:viewHome, challenge:viewChallenge, create:viewCreate, ranking:viewRanking, profile:viewProfile, dispute:viewDispute, sessions:viewSessions, session:viewSession, liveGroup:viewLiveGroup, liveChallenge:viewLiveChallenge, liveClaim:viewLiveClaim, ideas:viewIdeas, onboarding:viewOnboarding };

  function go(route, opts){
    ui.route = route;
    if(opts && opts.chId) ui.chId = opts.chId;
    if(route!=="challenge" && route!=="dispute" && route!=="liveChallenge") ui.pick = null;
    if(route!=="challenge" && route!=="liveChallenge") ui.resolvePick = null;
    if(route!=="liveChallenge"){ ui.lgReResolve = false; ui.lgConfirmDel = false; }
    if(route!=="liveGroup"){ ui.lgManageMembers = false; ui.lgKickPick = null; ui.lgConfirmGroupDel = false; }
    if(route!=="liveClaim") ui.liveClaimPick = null;
    if(route!=="dispute") ui.disputeReason = null;
    ui.confirmReset = false;
    ui.confirmEndSession = false;
    if(route!=="sessions") ui.sessionForm = null;
    ui.modal = null;
    render();
    document.getElementById("view").scrollTop = 0;
  }
  function render(){
    const onboarding = !state || !state.user;
    document.getElementById("topbar").hidden = onboarding;
    document.getElementById("bottomnav").hidden = onboarding;
    const fn = onboarding ? viewOnboarding : (VIEWS[ui.route] || viewHome);
    const view = document.getElementById("view");
    view.innerHTML = fn();
    if(RENDER_SILENT){ const c = view.firstElementChild; if(c) c.classList.remove("view-enter"); RENDER_SILENT = false; }
    if(!onboarding){
      renderCpPill(false);
      document.querySelectorAll("[data-nav]").forEach(b=> b.setAttribute("aria-current", b.dataset.nav===ui.route ? "page":"false"));
    }
    renderModalRoot();
  }
  function renderCpPill(pop){
    const amt = document.getElementById("cpAmount");
    if(!amt || !state) return;
    const target = state.wallet.balanceCp;
    const start = Number(String(amt.textContent).replace(/\D/g,"")) || 0;
    const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
    if(pop){ const p=document.getElementById("cpPill"); p.classList.add("pop"); setTimeout(()=>p.classList.remove("pop"),200); }
    if(start===target || reduce){ amt.textContent = fmt(target); return; }
    const dur=450, t0=performance.now();
    (function step(t){
      const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      amt.textContent = fmt(Math.round(start+(target-start)*e));
      if(k<1) requestAnimationFrame(step);
    })(t0);
  }

  /* =========================================================
     events
  ========================================================= */
  document.addEventListener("click", (e)=>{
    const t = e.target.closest("[data-nav],[data-open],[data-session-open],[data-lg-open],[data-idea],[data-locidea],[data-pickplace],[data-act],[data-pick],[data-rpick],[data-lg-rpick],[data-step],[data-resolve],[data-seg] button,[data-durmode],[data-rtab],[data-onb-av],[data-opt-add],[data-opt-del],[data-dreason]");
    if(!t) return;

    if(t.dataset.nav){ if(t.dataset.nav==="create") ui.draft = null; go(t.dataset.nav); return; }
    if(t.dataset.open){ go("challenge",{chId:t.dataset.open}); return; }
    if(t.dataset.sessionOpen){ ui.sessionId = t.dataset.sessionOpen; ui.sessionForm = null; go("session"); return; }
    if(t.hasAttribute("data-lg-open")){ ui.liveChId = t.getAttribute("data-lg-open"); ui.pick = null; ui.resolvePick = null; go("liveChallenge"); return; }
    if(t.hasAttribute("data-lg-rpick")){ ui.resolvePick = t.getAttribute("data-lg-rpick"); render(); return; }
    if(t.dataset.pickplace){ setMyPlace(t.dataset.pickplace); return; }
    const prefillDraft = (it, atLoc) => {
      ui.draft = { question: it.q, type: it.type,
        options: (it.opts && it.opts.length) ? it.opts.slice() : ["",""],
        durationMs: DURATION_STEPS[snapDurationIndex(it.dur || 10*MS_MIN)], endMode:"duration", endAt:null,
        visibility:"PUBLIC", category: it.cat || "Real Life",
        numMin: it.numMin ?? null, numMax: it.numMax ?? null, numDec: !!it.numDec,
        atLocation: !!(atLoc && locActive()), sessionId:null, blocked:null, preview:false };
      go("create");
    };
    if(t.dataset.idea!==undefined){ const it = IDEAS[Number(t.dataset.idea)]; if(it) prefillDraft(it, false); return; }
    if(t.dataset.locidea!==undefined){ const it = (ui._locIdeas||[])[Number(t.dataset.locidea)]; if(it) prefillDraft(it, true); return; }
    if(t.dataset.rtab){ ui.rankTab = t.dataset.rtab; render(); return; }
    if(t.hasAttribute("data-pick")){ ui.pick = t.dataset.pick; render(); return; }
    if(t.hasAttribute("data-rpick")){ ui.resolvePick = t.dataset.rpick; render(); return; }
    if(t.hasAttribute("data-dreason")){ ui.disputeReason = t.dataset.dreason; render(); return; }
    if(t.dataset.step){
      const inp = document.querySelector("[data-num]");
      const cur = parseNum(inp.value);
      const next = Math.max(0, round2((isNaN(cur) ? 0 : cur) + Number(t.dataset.step)));
      inp.value = fmtNum(next);
      ui.pick = String(next);
      const b = document.querySelector("[data-act='submit']"); if(b) b.disabled = false;
      return;
    }
    if(t.hasAttribute("data-resolve")){

  function toast(msg){

    const t = el(`<div class="toast">${esc(msg)}</div>`);

  function burstIfWin(){ if(ui.result && !ui.result.voided && ui.result.youPlayed && ((ui.result.payout>0) || (ui.result.points>0))) confetti(); }
  function confetti(){
    if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    const cv = document.getElementById("confetti"); cv.hidden = false;
    const ctx = cv.getContext("2d"), DPR = Math.min(2, devicePixelRatio||1);
    cv.width = innerWidth*DPR; cv.height = innerHeight*DPR;
    const cols = ["#38bdf8","#f2c14e","#33d69b","#a78bfa","#ff5d73"];
    const P = Array.from({length:120}, ()=>({
      x: innerWidth/2 + rint(-70,70), y: innerHeight*0.30 + rint(-20,20),
      vx:(Math.random()-0.5)*10, vy: Math.random()*-12-4,
      r: rint(3,7), c: pickR(cols), rot: Math.random()*6, vr:(Math.random()-0.5)*0.4
    }));
    let frame=0;
    (function loop(){
      frame++; ctx.clearRect(0,0,cv.width,cv.height);
      P.forEach(p=>{ p.vy+=0.35; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
        ctx.save(); ctx.translate(p.x*DPR,p.y*DPR); ctx.rotate(p.rot);
        ctx.fillStyle=p.c; ctx.fillRect(-p.r*DPR,-p.r*DPR,p.r*2*DPR,p.r*2*DPR); ctx.restore(); });
      if(frame<120) requestAnimationFrame(loop);
      else { ctx.clearRect(0,0,cv.width,cv.height); cv.hidden = true; }
    })();
  }

  /* =========================================================
     tick — live world, countdowns, auto-resolution
  ========================================================= */
  let TICK = 0, RENDER_SILENT = false;
  setInterval(()=>{
    if(!state || !state.user) return;
    TICK++;
    let structural = false;

    if(LIVE && TICK % 4 === 0) advanceLive();

    // OPEN -> LOCKED at lock time
    state.challenges.forEach(ch=>{ if(ch.status==="OPEN" && Date.now()>=ch.locksAt){ ch.status="LOCKED"; structural=true; } });

    // sessions: auto-finalize when their end time passes
    (state.sessions||[]).forEach(s=>{
      if(s.status==="active" && s.endsAt && Date.now()>=s.endsAt){
        finalizeSession(s); structural = true;
        toast(s.name + " ist beendet");
      }
    });

    // spawn new live challenges (~ every 12s, keep a few open)
    if(LIVE && TICK % 12 === 0){
      const openLive = state.challenges.filter(c=>c.live && c.status==="OPEN").length;
      if(openLive < 3 && Math.random() < 0.75){ spawnLiveChallenge(); structural = true; }
    }

    // auto-resolve locked live challenges shortly after they lock
    state.challenges.forEach(ch=>{
      if(ch.ephemeral && ch.status==="LOCKED" && !ch.disputeStatus && Date.now() - ch.locksAt > 4000){
        const played = ch.participants.some(p=>p.id==="you");
        const keepResult = ui.result;
        resolveChallenge(ch, resolveLive(ch));
        structural = true;
        if(played){
          const you = ch.participants.find(p=>p.id==="you");
          const good = you && you.payoutCp>0;
          toast((good?"⚡ Gewonnen · ":"⚡ Ergebnis · ") + shorten(ch.question.replace(/^\S+\s/,""),24) + " → " + outcomeLabel(ch, ch.outcome));
          const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
          if(good && !ui.modal && !typing && (ui.route==="home" || ui.route==="challenge")){
            openResultModal(ch.id); // celebrate a live win with the full popup
          } else if(good){
            confetti();
          }
        } else {
          ui.result = keepResult; // don't hijack the result screen for a challenge the user ignored
        }
      }
    });

    // drop finished live challenges the user didn't play (after a short grace)
    const n0 = state.challenges.length;
    state.challenges = state.challenges.filter(ch=>{
      if(!ch.ephemeral || ch.id===ui.chId) return true;
      const played = ch.participants.some(p=>p.id==="you");
      const done = ch.status==="RESOLVED" || ch.status==="VOID";
      return !(done && !played && Date.now() - (ch.resolvedAt||0) > 15000);
    });
    if(state.challenges.length !== n0) structural = true;

    // live ticker
    const tk = document.querySelector("[data-ticker]");
    if(tk && LIVE) tk.innerHTML = tickerHTML();

    // countdowns
    document.querySelectorAll("[data-cd]").forEach(node=>{
      const ch = findChallengeAnywhere(node.dataset.cd);
      if(!ch) return;
      node.textContent = countdownText(ch);
      node.classList.toggle("locked", ch.locksAt - Date.now() <= 0);
    });
    // live-group countdowns + poll
    document.querySelectorAll("[data-lgcd]").forEach(node=>{
      const c = ((LG.data&&LG.data.challenges)||[]).find(x=>x.id===node.dataset.lgcd);
      if(!c) return;
      node.textContent = lgCountdown(c);
      node.classList.toggle("locked", lgChStatus(c) !== "open");
    });
    if(lgOn() && LG.groupId && TICK % 2 === 0) lgPoll();

    if(structural){
      save();
      const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
      if(!typing && (ui.route==="home" || ui.route==="challenge" || ui.route==="ranking")){
        const v = document.getElementById("view"), sc = v.scrollTop;
        RENDER_SILENT = true;
        render();
        v.scrollTop = sc;
      }
    }
  }, 1000);

  /* =========================================================
     boot
  ========================================================= */
  state = load();
  initLive();
  lgLoadCfg();
  applyTheme();
  if(state && state.user){
    state.challenges = state.challenges || [];
    state.bots = (state.bots && state.bots.length) ? state.bots : makeBots();
    state.stats = Object.assign({ validCount:0,correctCount:0,currentStreak:0,longestStreak:0,lastActiveDate:null,totalCpWon:0,predictionScore:0,publicValidCount:0,createdCount:0,createRewardDate:null,createRewardCount:0,adBonusDate:null,adBonusCount:0 }, state.stats||{});
    state.sessions = state.sessions || [];
    if(state.locationEnabled === undefined) state.locationEnabled = !!state.location; // Bestandsnutzer: an, wenn Ort vorhanden
    state.challenges.forEach(c=>{ c.disputes = c.disputes||[]; if(c.disputeStatus===undefined) c.disputeStatus=null;
      if(c.visibility==="PRIVATE") c.visibility="FRIENDS"; }); // "Privat" abgeschafft -> Partymodus
    // clear stale live challenges from a previous session (keep ones the user played)
    state.challenges = state.challenges.filter(c => !c.ephemeral || c.participants.some(p=>p.id==="you"));
    grantDailyIfDue();
    ensureLiveChallenges();
  }
  render();
  applyTheme();
  lgAutoJoin();
})();
</script>
